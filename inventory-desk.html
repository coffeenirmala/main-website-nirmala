// ══ OWNER: FORECAST ══
function renderForecast(){
  const sales=getSales(), inv=getInv();

  // Build 7-day usage map
  const days7=Array.from({length:7},(_,i)=>addDays(today(),-i)); // tanggal WIB
  const usage={};
  sales.filter(s=>s.type==='manual'&&days7.includes(s.date)).forEach(s=>{
    if(!usage[s.item])usage[s.item]={};
    usage[s.item][s.date]=(usage[s.item][s.date]||0)+s.qty;
  });

  // ── PANEL 1: Consumption Rate ──
  const totalUsage=Object.entries(usage).map(([name,dmap])=>{
    const total=Object.values(dmap).reduce((a,b)=>a+b,0);
    const def=itemDef(name);
    const active=Object.keys(dmap).length;
    return{name,total,unit:def?def.unit:'',active,avgDay:total/7};
  }).filter(i=>i.total>0).sort((a,b)=>b.total-a.total);

  const maxU=totalUsage.length?totalUsage[0].total:1;
  const consumptionHTML=totalUsage.slice(0,10).map((item,i)=>{
    const pct=Math.min(100,(item.total/maxU)*100);
    const barColor=i===0?'var(--ink)':i<=2?'var(--ink2)':'var(--mist)';
    return '<div class="consumption-item">'+
      '<div class="consumption-bar-label">'+
        '<span class="consumption-name">'+item.name+'</span>'+
        '<span class="consumption-val">'+item.total.toFixed(1)+' '+item.unit+' · avg '+item.avgDay.toFixed(1)+'/hari</span>'+
      '</div>'+
      '<div class="consumption-bar-track"><div class="consumption-bar-fill" style="width:'+pct+'%;background:'+barColor+';"></div></div>'+
    '</div>';
  }).join('');

  // ── PANEL 2: Days of Stock Remaining — PER MENU ──
  const menuAnalysis=Object.entries(RECIPES).map(([menuName,recipe])=>{
    let maxPortions=Infinity;
    let limitIng=null;

    Object.entries(recipe).forEach(([ing,amt])=>{
      const stock=inv[ing]??0;
      const possible=amt>0?Math.floor(stock/amt):Infinity;
      if(possible<maxPortions){maxPortions=possible;limitIng=ing;}
    });
    if(maxPortions===Infinity)maxPortions=0;

    // Days until limiting ingredient depletes (based on avg daily usage)
    const limStock=limitIng?(inv[limitIng]??0):0;
    const limAvgDay=limitIng&&usage[limitIng]
      ?Object.values(usage[limitIng]).reduce((a,b)=>a+b,0)/7
      :0;
    const daysLeft=limAvgDay>0?limStock/limAvgDay:Infinity;

    // Per-ingredient portion calc for detail modal
    const ingCalc=Object.entries(recipe).map(([ing,amt])=>{
      const stock=inv[ing]??0;
      const portions=amt>0?Math.floor(stock/amt):9999;
      const def=itemDef(ing);
      const unit=def?def.unit:'';
      const avgD=usage[ing]?Object.values(usage[ing]).reduce((a,b)=>a+b,0)/7:0;
      return{ing,amt,stock,portions,unit,isBottleneck:ing===limitIng,avgD};
    });

    return{menuName,maxPortions,limitIng,limStock,limAvgDay,daysLeft,ingCalc};
  }).sort((a,b)=>{
    if(a.maxPortions===0&&b.maxPortions!==0)return-1;
    if(b.maxPortions===0&&a.maxPortions!==0)return 1;
    const da=a.daysLeft===Infinity?9999:a.daysLeft;
    const db=b.daysLeft===Infinity?9999:b.daysLeft;
    if(da!==db)return da-db;
    return a.maxPortions-b.maxPortions;
  });

  const menuGaugeHTML=menuAnalysis.map(m=>{
    let color,label,pct,sublabel;
    const d=m.daysLeft;
    if(m.maxPortions===0){
      color='var(--danger)';label='Tidak bisa dibuat';pct=0;sublabel='Stok habis';
    } else if(d===Infinity){
      color='var(--green)';label=m.maxPortions+' porsi';pct=100;sublabel='Data pemakaian belum ada';
    } else if(d<1){
      color='var(--danger)';label='< 1 hari';pct=3;sublabel=m.maxPortions+' porsi tersisa';
    } else if(d<3){
      color='var(--danger)';label='~'+d.toFixed(1)+' hari';pct=Math.min(95,d/14*100);sublabel=m.maxPortions+' porsi tersisa';
    } else if(d<7){
      color='var(--warn)';label='~'+d.toFixed(1)+' hari';pct=Math.min(95,d/14*100);sublabel=m.maxPortions+' porsi tersisa';
    } else {
      color='var(--green)';label='~'+Math.floor(d)+' hari';pct=Math.min(95,d/14*100);sublabel=m.maxPortions+' porsi tersisa';
    }
    const enc=encodeURIComponent(JSON.stringify(m));
    return '<div class="menu-gauge-item" onclick="showMenuDetail(\''+enc+'\')">'+
      '<div class="mgauge-top">'+
        '<div><div class="mgauge-name">'+m.menuName+'</div>'+
        (m.limitIng?'<div class="mgauge-sub">Bottleneck: '+m.limitIng+'</div>':'')+'</div>'+
        '<div><div class="mgauge-label" style="color:'+color+';">'+label+'</div>'+
        '<div class="mgauge-sub">'+sublabel+'</div></div>'+
      '</div>'+
      '<div class="mgauge-bar-track"><div class="mgauge-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'+
    '</div>';
  }).join('');

  const empty='<div class="empty-state"><div class="empty-title">Belum ada data pemakaian</div><div class="empty-text">Mulai input pengurangan stok di tab Input Stok.</div></div>';

  return '<div class="page-header"><div class="page-title">Forecast</div>'+
    '<div class="page-subtitle">Analisis stok & pemakaian 7 hari terakhir · Tap menu untuk detail kalkulasi</div></div>'+
    '<div class="forecast-grid">'+
      '<div class="forecast-card">'+
        '<div class="fc-title">Consumption Rate <span style="font-size:10px;background:var(--cream);padding:3px 8px;border-radius:100px;">7 hari</span></div>'+
        (consumptionHTML||empty)+
      '</div>'+
      '<div class="forecast-card">'+
        '<div class="fc-title">Days of Stock Remaining — Per Menu</div>'+
        '<div class="menu-gauge-list">'+menuGaugeHTML+'</div>'+
      '</div>'+
    '</div>';
}

// ── MENU DETAIL MODAL dengan math lengkap ──
function showMenuDetail(enc){
  const m=JSON.parse(decodeURIComponent(enc));
  const inv=getInv();

  // Rebuild ingCalc fresh from current inv (enc might be stale)
  const recipe=RECIPES[m.menuName]||{};
  let minPortion=Infinity, bottleneckIng=null;
  Object.entries(recipe).forEach(([ing,amt])=>{
    const stock=inv[ing]??0;
    const p=amt>0?Math.floor(stock/amt):9999;
    if(p<minPortion){minPortion=p;bottleneckIng=ing;}
  });
  if(minPortion===Infinity)minPortion=0;

  // Ingredient rows
  const ingRows=Object.entries(recipe).map(([ing,amt])=>{
    const stock=inv[ing]??0;
    const portions=amt>0?Math.floor(stock/amt):999;
    const def=itemDef(ing);
    const unit=def?def.unit:'';
    const isB=ing===bottleneckIng;
    return '<div class="math-row'+(isB?' bottleneck':'')+'">'+
      '<div style="font-size:13px;'+(isB?'font-weight:700;color:var(--danger);':'')+'">'+
        (isB?'⚠ ':'')+ing+
      '</div>'+
      '<div style="text-align:right;font-size:12px;color:var(--mist);">'+
        fmtNum(stock)+' '+unit+' ÷ '+amt+' '+unit+'/porsi = <strong style="color:'+(isB?'var(--danger)':'var(--ink)')+';">'+portions+' porsi</strong>'+
      '</div>'+
    '</div>';
  }).join('');

  // Days formula
  let daysHTML='<div style="font-size:12px;color:var(--mist);background:var(--cream);padding:12px;border-radius:12px;margin-top:12px;">Belum ada data historis pemakaian. Catat pengurangan stok agar prediksi hari tersedia.</div>';

  if(m.limAvgDay>0 && bottleneckIng){
    const limStock=inv[bottleneckIng]??0;
    const def=itemDef(bottleneckIng);
    const unit=def?def.unit:'';
    const days=(limStock/m.limAvgDay);
    daysHTML='<div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mist);margin:16px 0 8px;">Prediksi Ketahanan (Berdasarkan '+bottleneckIng+')</div>'+
      '<div class="math-formula">'+
        'Stok '+bottleneckIng+' saat ini = '+fmtNum(limStock)+' '+unit+'<br>'+
        'Avg pemakaian harian (7 hari) = '+m.limAvgDay.toFixed(2)+' '+unit+'/hari<br>'+
        '─────────────────────────────────<br>'+
        fmtNum(limStock)+' ÷ '+m.limAvgDay.toFixed(2)+' = <strong>'+days.toFixed(1)+' hari</strong>'+
        (minPortion>0?'<br><br>Pada laju ini, menu ini bisa dibuat ±<strong>'+Math.floor(days * (m.limAvgDay / (recipe[bottleneckIng]||1)))+' porsi</strong> lagi sebelum stok habis':'')
      +'</div>';
  }

  document.getElementById('modal-inner').innerHTML=
    '<div class="modal-title">'+m.menuName+'</div>'+
    '<div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mist);margin-bottom:12px;">Kalkulasi Porsi per Bahan</div>'+
    '<div style="background:var(--cream);border-radius:12px;padding:12px 16px;margin-bottom:4px;">'+ingRows+'</div>'+
    '<div style="background:var(--ink);color:var(--paper);border-radius:12px;padding:16px 20px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;">'+
      '<div><div style="font-size:11px;opacity:0.5;letter-spacing:1px;margin-bottom:4px;">TOTAL PORSI TERSISA</div>'+
      '<div style="font-size:28px;font-weight:400;">'+minPortion+'<span style="font-size:14px;font-weight:400;opacity:0.6;margin-left:4px;">porsi</span></div></div>'+
      (bottleneckIng?'<div style="text-align:right;font-size:12px;opacity:0.6;">Dibatasi oleh<br><strong>'+bottleneckIng+'</strong></div>':'')+
    '</div>'+
    daysHTML+
    '<div class="modal-actions" style="margin-top:20px;"><button class="btn-full" onclick="closeModal()">Tutup</button></div>';

  showModal();
}

// ══ EXPORT LAPORAN (.xlsx — 2 sheet: Log Harian & Ringkasan Pemakaian) ══
// Sumber data: nc_sales (Pemakaian) + nc_restock (Restock Masuk), difilter by tanggal.
// Tidak pakai snapshot stok bulanan — supaya tetap simpel & minim maintenance.

let _expPeriod = 'harian';

function openExportModal(){
  document.getElementById('modal-inner').innerHTML=
    '<div class="modal-title">Export Laporan</div>'+
    '<label class="form-label">Periode</label>'+
    '<div style="display:flex;gap:8px;margin-bottom:20px;">'+
      '<button type="button" class="btn-ghost" id="ep-harian" style="flex:1;" onclick="setExportPeriod(\'harian\')">Harian</button>'+
      '<button type="button" class="btn-ghost" id="ep-mingguan" style="flex:1;" onclick="setExportPeriod(\'mingguan\')">Mingguan</button>'+
      '<button type="button" class="btn-ghost" id="ep-bulanan" style="flex:1;" onclick="setExportPeriod(\'bulanan\')">Bulanan</button>'+
    '</div>'+
    '<div id="export-period-field"></div>'+
    '<div style="font-size:11px;color:var(--mist);background:var(--cream);padding:10px 14px;border-radius:12px;margin-bottom:8px;line-height:1.6;">File .xlsx berisi 2 sheet: <strong>Log Harian</strong> (semua aktivitas pemakaian & restock) dan <strong>Ringkasan Pemakaian</strong> (total pemakaian per bahan, dihitung otomatis dari Log Harian).</div>'+
    '<div class="modal-actions"><button class="btn-ghost" onclick="closeModal()">Batal</button><button class="btn-full" style="flex:1;" onclick="doExport()">⬇ Download .xlsx</button></div>';
  showModal();
  setExportPeriod('harian');
}

function setExportPeriod(p){
  _expPeriod=p;
  ['harian','mingguan','bulanan'].forEach(id=>{
    const btn=document.getElementById('ep-'+id);
    if(btn){
      btn.style.background = id===p ? 'var(--ink)' : 'transparent';
      btn.style.color = id===p ? 'var(--paper)' : 'var(--ink)';
    }
  });
  const field=document.getElementById('export-period-field');
  const t=today();
  if(p==='harian'){
    field.innerHTML='<label class="form-label">Pilih Tanggal</label><input type="date" class="form-input" id="exp-date" value="'+t+'">';
  } else if(p==='mingguan'){
    field.innerHTML='<label class="form-label">Pilih Tanggal (dalam minggu tsb)</label>'+
      '<input type="date" class="form-input" id="exp-date" value="'+t+'" oninput="updateWeekPreview()">'+
      '<div id="week-preview" style="font-size:12px;color:var(--mist);margin-top:-12px;margin-bottom:20px;"></div>';
} else {
    const nowY=new Date().getFullYear(), nowM=new Date().getMonth()+1;
    let yearOpts='';
    for(let y=nowY;y>=nowY-4;y--)yearOpts+='<option value="'+y+'">'+y+'</option>';
    field.innerHTML='<label class="form-label">Pilih Bulan</label>'+
      '<div style="display:flex;gap:10px;">'+
        '<select class="form-input" id="exp-month-sel" style="margin-bottom:8px;flex:1;" onchange="renderExportMonthOptions()"></select>'+
        '<select class="form-input" id="exp-year-sel" style="margin-bottom:8px;flex:1;" onchange="renderExportMonthOptions()">'+yearOpts+'</select>'+
      '</div>'+
      '<div style="font-size:12px;color:var(--mist);margin-bottom:20px;">Bisa pilih bulan sebelumnya — laporan diambil dari data yang sudah tercatat di bulan tsb. Bulan yang belum berjalan tidak bisa dipilih.</div>';
    document.getElementById('exp-year-sel').value=nowY;
    renderExportMonthOptions();
  }
  if(p==='mingguan')setTimeout(updateWeekPreview,0);
}

function renderExportMonthOptions(){
  const nowY=new Date().getFullYear(), nowM=new Date().getMonth()+1;
  const yearSel=document.getElementById('exp-year-sel');
  const monthSel=document.getElementById('exp-month-sel');
  if(!yearSel||!monthSel)return;
  const selY=parseInt(yearSel.value,10);
  const monthNames=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const prevVal=parseInt(monthSel.value,10)||nowM;
  let opts='';
  for(let m=1;m<=12;m++){
    const isFuture = selY===nowY && m>nowM;
    opts+='<option value="'+m+'"'+(isFuture?' disabled':'')+'>'+monthNames[m-1]+'</option>';
  }
  monthSel.innerHTML=opts;
  monthSel.value = (selY===nowY && prevVal>nowM) ? nowM : prevVal;
}

function getMondayOf(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return d;
}
function updateWeekPreview(){
  const el=document.getElementById('exp-date');
  const prev=document.getElementById('week-preview');
  if(!el||!prev)return;
  const mon=getMondayOf(el.value);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const opt={day:'numeric',month:'short'};
  prev.textContent='Minggu: '+mon.toLocaleDateString('id-ID',opt)+' – '+sun.toLocaleDateString('id-ID',opt);
}

function computeRange(){
  if(_expPeriod==='harian'){
    const d=document.getElementById('exp-date').value;
    return {start:d,end:d,label:d};
  }
  if(_expPeriod==='mingguan'){
    const d=document.getElementById('exp-date').value;
    const mon=getMondayOf(d);
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    const fmtD=x=>x.toISOString().split('T')[0];
    return {start:fmtD(mon),end:fmtD(sun),label:fmtD(mon)+'_sd_'+fmtD(sun)};
  }
  const mSel=document.getElementById('exp-month-sel'), ySel=document.getElementById('exp-year-sel');
  if(!mSel||!ySel||!mSel.value||!ySel.value)return{start:null,end:null,label:null};
  const m=parseInt(mSel.value,10), y=parseInt(ySel.value,10);
  const now=new Date();
  if(y>now.getFullYear() || (y===now.getFullYear() && m>now.getMonth()+1)){
    return {start:null,end:null,label:null,future:true};
  }
  const ym=y+'-'+String(m).padStart(2,'0');
  const start=ym+'-01';
  const lastDay=new Date(y,m,0).getDate();
  const end=ym+'-'+String(lastDay).padStart(2,'0');
  return {start,end,label:ym};
}

function doExport(){
  const range=computeRange();
  if(range.future){toast('Bulan tersebut belum berjalan, tidak bisa didownload','wrn');return;}
  if(!range.start){toast('Pilih periode dulu','wrn');return;}
  if(typeof XLSX==='undefined'){toast('Gagal memuat modul xlsx, cek koneksi internet','err');return;}
  const sales=getSales().filter(s=>s.date>=range.start&&s.date<=range.end);
  const restock=getRestock().filter(r=>r.date>=range.start&&r.date<=range.end);

  const combined=[
    ...sales.filter(s=>s.type==='manual').map(s=>({date:s.date,ts:s.ts,item:s.item,type:'Pemakaian',qty:s.qty,unit:s.unit,note:''})),
    ...restock.map(r=>({date:r.date,ts:r.ts,item:r.item,type:'Restock Masuk',qty:r.qty,unit:r.unit,note:(r.price?fmtRp(r.price):'')+(r.note?' · '+r.note:'')}))
  ].sort((a,b)=>a.ts-b.ts);

  const logRows=[['Tanggal','Waktu','Bahan','Tipe','Qty','Satuan','Catatan/Harga']];
  combined.forEach(row=>{
    const waktu=new Date(row.ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    logRows.push([row.date,waktu,row.item,row.type,row.qty,row.unit,row.note]);
  });
  if(combined.length===0)logRows.push(['—','—','Tidak ada aktivitas pada periode ini','—','—','—','—']);

// Hanya baris type:'manual' (bahan baku gramasi) yang masuk Ringkasan Pemakaian ini.
  // (Log Harian di atas juga sudah difilter sama, lihat baris 1002 — type:'pos_sale'/'pos_sale_free'
  // = nama menu yang terjual, bukan bahan baku, jadi di-skip dari kedua sheet.)
  const usageMap={};
  sales.filter(s=>s.type==='manual').forEach(s=>{
    if(!usageMap[s.item])usageMap[s.item]={total:0,unit:s.unit};
    usageMap[s.item].total+=s.qty;
  });

  const summaryRows=[['Nama Bahan Baku','Penggunaan','Satuan','Total Nominal Terpakai (Rp)']];
  let totalNominalAll=0;
  Object.entries(usageMap).sort((a,b)=>b[1].total-a[1].total).forEach(([name,d])=>{
    const hargaSatuan = UNIT_PRICES[name] ?? 0;
    const nominal = d.total * hargaSatuan;
    totalNominalAll += nominal;
    summaryRows.push([
      name,
      Number(d.total.toFixed(2)),
      d.unit,
      hargaSatuan > 0 ? fmtRp(Math.round(nominal)) : '—' // ← format "Rp 1.200.000"
    ]);
  });

  if(Object.keys(usageMap).length===0){
    summaryRows.push(['—','Tidak ada pemakaian pada periode ini','—','—']);
  } else {
    summaryRows.push(['TOTAL','','',fmtRp(Math.round(totalNominalAll))]);
  }
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(logRows);
  const ws2=XLSX.utils.aoa_to_sheet(summaryRows);
  ws1['!cols']=[{wch:12},{wch:8},{wch:20},{wch:14},{wch:10},{wch:8},{wch:24}];
  ws2['!cols']=[{wch:20},{wch:14},{wch:10},{wch:22}];
  XLSX.utils.book_append_sheet(wb,ws1,'Log Harian');
  XLSX.utils.book_append_sheet(wb,ws2,'Ringkasan Pemakaian');

  const periodLabel = _expPeriod==='harian' ? 'harian-'+range.start
                     : _expPeriod==='mingguan' ? 'mingguan-'+range.label
                     : 'bulanan-'+range.label;
  XLSX.writeFile(wb,'nirmala-'+periodLabel+'.xlsx');
  closeModal();
  toast('Laporan .xlsx berhasil diexport','ok');
}

// ══ CEK STOK FISIK (jenis cek otomatis sesuai jam) + SELISIH & PENGATURAN BAHAN (owner) ══
// Logika utama ada di database (nc_stock_check_status, nc_submit_stock_check,
// nc_stock_check_report, nc_fix_stock_line). Halaman ini hanya menampilkan & mengirim angka.
const CEK_TYPES={open:'Buka Pagi',handover:'Pergantian Shift',close:'Closing'};
const CEK_HOURS='Buka Pagi 07:00–09:00 · Pergantian Shift 14:30–16:00 · Closing 22:00–23:30';
let _cek={st:null};
const cid=n=>'ck-'+String(n).replace(/[^\w]+/g,'_');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isWadah=i=>(i.tare_g||0)>0;
// berat jenis (gram per satuan) dari kalibrasi botol penuh; tanpa kalibrasi dianggap 1
const densOf=i=>(i.full_gross_g>i.tare_g&&i.full_content>0)?(i.full_gross_g-i.tare_g)/i.full_content:1;
const wadahQty=(i,sealed,gross)=>(sealed||0)*(i.full_content||0)+Math.max(0,(gross||0)-i.tare_g)/densOf(i);
const waitName=n=>n?esc(n):'<span style="color:var(--warn);">menunggu clock in</span>';
async function priceMap(date){
  // harga per satuan termasuk sirup buatan sendiri (dihitung dari resep batch)
  const r=await sb.rpc('nc_unit_costs',{p_date:date});
  if(!r.error&&r.data){const m={};r.data.forEach(x=>{m[x.name]=+x.unit_price;});return m;}
  const {data}=await sb.from('nc_ingredient_price').select('ingredient,unit_price,effective_from').lte('effective_from',date).order('effective_from',{ascending:false});
  const m={};(data||[]).forEach(r=>{if(!(r.ingredient in m))m[r.ingredient]=+r.unit_price;});return m;}

// ── BARISTA: CEK STOK ──
function renderCek(){setTimeout(loadCek,0);
  return '<div class="page-header"><div class="page-title">Cek Stok</div><div class="page-subtitle">Timbang & hitung fisik semua bahan, isi apa adanya. Angka ini menjadi stok resmi.</div></div><div id="cek-body">Memuat…</div>';}
async function loadCek(){
  const {data,error}=await sb.rpc('nc_stock_check_status');
  const body=document.getElementById('cek-body');if(!body)return;
  if(error){body.innerHTML='<div class="alert-strip alert-danger"><div><div class="alert-label" style="color:var(--danger);">Gagal memuat status cek stok</div><div class="alert-body">'+esc(error.message)+'</div></div></div>';return;}
  _cek.st=data;drawCek();
}
function drawCek(){
  const body=document.getElementById('cek-body');if(!body)return;
  const s=_cek.st;
  if(!s.check_type){
    body.innerHTML='<div class="alert-strip alert-warn"><div><div class="alert-label" style="color:var(--warn);">Belum jam cek stok</div><div class="alert-body">'+
      (s.next_label?'Cek berikutnya: <strong>'+esc(s.next_label)+'</strong> mulai '+esc(s.next_opens)+'.<br>':'')+'Jam cek: '+CEK_HOURS+'</div></div></div>';
    return;
  }
  if(s.submitted){
    body.innerHTML='<div class="alert-strip" style="background:rgba(159,216,180,.08);border-color:rgba(159,216,180,.5);"><div><div class="alert-label" style="color:var(--green);">Cek '+esc(s.label)+' hari ini sudah tersimpan ✓</div><div class="alert-body">Kalau ada angka yang salah, minta owner mengoreksi di tab Selisih.</div></div></div>';
    return;
  }
  const who=s.check_type==='handover'
    ?'Diserahkan Shift 1: <strong>'+waitName(s.shift1)+'</strong> → diterima Shift 2: <strong>'+waitName(s.shift2)+'</strong>'
    :s.check_type==='close'?'Shift 2: <strong>'+waitName(s.shift2)+'</strong>':'Shift 1: <strong>'+waitName(s.shift1)+'</strong>';
  const head='<div class="alert-strip alert-warn"><div><div class="alert-label">Cek '+esc(s.label)+' · ditutup jam '+esc(s.closes)+'</div>'+
    '<div class="alert-body">'+who+'<br>Nama diambil dari absensi. Kalau barista belum clock in, data tetap tersimpan dan namanya terisi otomatis setelah clock in.</div></div></div>';
  const cards=INVENTORY_DEF.map(i=>{
    const id=cid(i.name),n=esc(i.name);
    let inputs;
    if(isWadah(i)){
      const sealed=i.full_content>0
        ?'<div class="ck-lbl">Botol utuh (masih segel)</div><div class="input-row"><input type="number" class="qty-input" id="'+id+'-s" data-n="'+n+'" placeholder="0" min="0" step="1" inputmode="numeric" oninput="cekPreview(this.dataset.n)"><span class="unit-label">botol</span></div>'
        :'';
      inputs=sealed+
        '<div class="ck-lbl">Berat botol terbuka + isinya</div><div class="input-row"><input type="number" class="qty-input" id="'+id+'-g" data-n="'+n+'" placeholder="Timbang" min="0" step="any" inputmode="decimal" oninput="cekPreview(this.dataset.n)"><span class="unit-label">gr</span></div>'+
        '<div class="input-card-stock" id="'+id+'-p" style="margin:8px 0 0;">Isi bersih: — '+esc(i.unit)+' (botol kosong '+fmtNum(i.tare_g)+' gr dikurangi otomatis)</div>';
    } else {
      inputs='<div class="input-row"><input type="number" class="qty-input" id="'+id+'" placeholder="Sisa" min="0" step="any" inputmode="decimal"><span class="unit-label">'+esc(i.unit)+'</span></div>';
    }
    return '<div class="input-card"><div class="input-card-name">'+n+'</div>'+inputs+
      '<input type="text" class="form-input" id="'+id+'-r" placeholder="Catatan (opsional), mis. susu tumpah 200 ml" style="margin:10px 0 0;padding:8px 12px;font-size:13px;"></div>';
  }).join('');
  body.innerHTML=head+(INVENTORY_DEF.length?'<div class="input-grid">'+cards+'</div>':'<div class="empty-state"><div class="empty-title">Belum ada bahan aktif</div></div>')+
    '<button class="btn-full" id="cek-submit" style="margin-top:24px;" onclick="submitCek()">Simpan Cek '+esc(s.label)+'</button>';
  body.oninput=e=>{if(e.target&&e.target.style)e.target.style.borderColor='';};
}
function cekPreview(name){
  const i=itemDef(name);if(!i)return;
  const id=cid(name),g=document.getElementById(id+'-g').value,sEl=document.getElementById(id+'-s');
  const p=document.getElementById(id+'-p');
  if(g===''){p.innerHTML='Isi bersih: — '+esc(i.unit)+' (botol kosong '+fmtNum(i.tare_g)+' gr dikurangi otomatis)';return;}
  const q=wadahQty(i,sEl&&sEl.value!==''?+sEl.value:0,+g);
  p.innerHTML='Isi bersih: <strong>'+fmtNum(Math.round(q*10)/10)+' '+esc(i.unit)+'</strong>'+((+g)>0&&(+g)<i.tare_g?' <span style="color:var(--danger);">· lebih ringan dari botol kosong, cek lagi</span>':'');
}
async function submitCek(){
  const s=_cek.st;if(!s||!s.check_type)return;
  const lines=[],missing=[];
  const mark=(el,bad)=>{if(el)el.style.borderColor=bad?'var(--danger)':'';};
  for(const i of INVENTORY_DEF){
    const id=cid(i.name),reason=document.getElementById(id+'-r').value.trim();
    if(isWadah(i)){
      const gEl=document.getElementById(id+'-g'),sEl=document.getElementById(id+'-s');
      const g=gEl.value,sv=sEl?sEl.value:'';
      const bad=g===''||isNaN(g)||+g<0||(sv!==''&&(isNaN(sv)||+sv<0));
      mark(gEl,bad);if(bad){missing.push(i.name);continue;}
      lines.push({ingredient:i.name,gross:+g,sealed:sv===''?0:+sv,reason});
    } else {
      const el=document.getElementById(id),v=el.value;
      const bad=v===''||isNaN(v)||+v<0;
      mark(el,bad);if(bad){missing.push(i.name);continue;}
      lines.push({ingredient:i.name,qty:+v,reason});
    }
  }
  if(missing.length){toast('Belum diisi: '+missing.join(', '),'wrn');return;}
  if(!confirm('Simpan cek '+s.label+'? Angka yang kamu isi akan menjadi stok resmi dan tidak bisa diubah barista.'))return;
  const btn=document.getElementById('cek-submit');btn.disabled=true;btn.textContent='Menyimpan…';
  const {data,error}=await sb.rpc('nc_submit_stock_check',{p_lines:lines});
  if(error){toast('Gagal: '+error.message,'err');btn.disabled=false;btn.textContent='Simpan Cek '+s.label;return;}
  toast('Cek '+data.label+' tersimpan. Terima kasih!','ok');
  await loadAllData();
  checkInventoryROP();
  loadCek();
}

// ── OWNER: SELISIH ──
// Periode: Shift (1 tanggal + 1 shift), Harian, Mingguan (Senin–Minggu), Bulanan (tgl 1 s/d akhir bulan).
// Periode yang masih berjalan dipotong sampai HARI INI, mis. bulanan Oktober dilihat tgl 16 = 1–16 Okt.
let _sel={rows:[],range:null};
let _selMode='harian';
const MONTHS_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function addDays(ymd,n){const d=new Date(ymd+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function fmtTgl(ymd){const [y,m,d]=ymd.split('-').map(Number);return d+' '+MONTHS_ID[m-1].slice(0,3)+' '+y;}
function renderSelisih(){
  setTimeout(()=>setSelMode(_selMode),0);
  const modes=[['shift','Shift'],['harian','Harian'],['mingguan','Mingguan'],['bulanan','Bulanan']];
  return '<div class="page-header"><div class="page-title">Selisih</div><div class="page-subtitle">Stok fisik hasil timbang vs catatan sistem, per cek & per barista</div></div>'+
  '<div style="display:flex;gap:8px;margin-bottom:16px;max-width:560px;">'+
    modes.map(([k,l])=>'<button type="button" class="btn-ghost sel-mode" id="sm-'+k+'" style="flex:1;" onclick="setSelMode(\''+k+'\')">'+l+'</button>').join('')+'</div>'+
  '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;">'+
    '<div id="sel-fields" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;"></div>'+
    '<div><label class="form-label">Barista</label><select class="form-input" id="sl-bar" style="margin:0;min-width:190px;" onchange="drawSelisih()"><option value="">Semua barista</option></select></div>'+
    '<button class="btn-sm" onclick="loadSelisih()">Tampilkan</button><button class="btn-ghost" onclick="exportSelisih()">⬇ Excel</button></div>'+
  '<div id="sl-range" style="font-size:12px;color:var(--mist);margin-bottom:24px;"></div>'+
  '<div id="sl-body">Memuat…</div>';}
function setSelMode(m){
  _selMode=m;
  document.querySelectorAll('.sel-mode').forEach(b=>{const on=b.id==='sm-'+m;b.style.background=on?'var(--ink)':'transparent';b.style.color=on?'var(--paper)':'var(--ink)';});
  const f=document.getElementById('sel-fields');if(!f)return;
  const t=today(),dateIn=lbl=>'<div><label class="form-label">'+lbl+'</label><input type="date" class="form-input" id="sl-d" value="'+t+'" max="'+t+'" style="margin:0;" onchange="loadSelisih()"></div>';
  if(m==='shift'){
    f.innerHTML=dateIn('Tanggal')+'<div><label class="form-label">Shift</label><select class="form-input" id="sl-s" style="margin:0;" onchange="loadSelisih()"><option value="1">Shift 1 · Buka Pagi + Pergantian</option><option value="2">Shift 2 · Closing</option></select></div>';
  } else if(m==='harian'){
    f.innerHTML=dateIn('Tanggal');
  } else if(m==='mingguan'){
    f.innerHTML=dateIn('Tanggal (minggu tsb)');
  } else {
    const [y,mo]=t.split('-').map(Number);let ys='';for(let i=y;i>=y-3;i--)ys+='<option value="'+i+'">'+i+'</option>';
    f.innerHTML='<div><label class="form-label">Bulan</label><select class="form-input" id="sl-m" style="margin:0;" onchange="loadSelisih()">'+
      MONTHS_ID.map((n,i)=>'<option value="'+(i+1)+'"'+(i+1===mo?' selected':'')+'>'+n+'</option>').join('')+'</select></div>'+
      '<div><label class="form-label">Tahun</label><select class="form-input" id="sl-y" style="margin:0;" onchange="loadSelisih()">'+ys+'</select></div>';
  }
  showSelRange();loadSelisih();
}
function selRange(){
  const t=today(),m=_selMode;let from,to,label,shift=null,desc;
  if(m==='bulanan'){
    const y=+document.getElementById('sl-y').value,mo=+document.getElementById('sl-m').value,mm=String(mo).padStart(2,'0');
    from=y+'-'+mm+'-01';to=addDays((mo===12?(y+1)+'-01':y+'-'+String(mo+1).padStart(2,'0'))+'-01',-1);
    label='bulanan-'+y+'-'+mm;desc='Bulan '+MONTHS_ID[mo-1]+' '+y;
  } else {
    const d=document.getElementById('sl-d').value;if(!d)return {error:'Pilih tanggal dulu'};
    if(m==='mingguan'){
      const dow=new Date(d+'T00:00:00Z').getUTCDay();from=addDays(d,-((dow+6)%7));to=addDays(from,6);
      label='mingguan-'+from;desc='Minggu Senin–Minggu';
    } else {
      from=to=d;
      if(m==='shift'){shift=+document.getElementById('sl-s').value;label='shift'+shift+'-'+d;desc='Shift '+shift;}
      else{label='harian-'+d;desc='Harian';}
    }
  }
  if(from>t)return {error:'Periode itu belum berjalan'};
  const capped=to>t;if(capped)to=t;
  return {from,to,label,shift,desc,capped};
}
function showSelRange(){
  const el=document.getElementById('sl-range');if(!el)return;
  const r=selRange();
  el.innerHTML=r.error?'<span style="color:var(--danger);">'+esc(r.error)+'</span>'
    :'Periode: <strong>'+fmtTgl(r.from)+(r.to!==r.from?' – '+fmtTgl(r.to):'')+'</strong> · '+esc(r.desc)+(r.capped?' (masih berjalan, dihitung sampai hari ini)':'');
}
const respName=r=>(r.shift===1?r.shift1:r.shift2)||null;
function statusTag(r){
  if(r.status==='ok')return '<span class="status-pill s-ok"><span class="dot dot-ok"></span>Tersimpan '+esc(r.submitted_at||'')+'</span>';
  if(r.status==='terlewat')return '<span class="status-pill s-danger"><span class="dot dot-danger"></span>Terlewat</span>';
  return '<span class="status-pill s-warn"><span class="dot dot-warn"></span>Menunggu</span>';
}
async function loadSelisih(){
  const el=document.getElementById('sl-body');if(!el)return;
  const r=selRange();showSelRange();
  if(r.error){el.innerHTML='';return;}
  el.innerHTML='Memuat…';
  const {data,error}=await sb.rpc('nc_stock_check_report',{p_from:r.from,p_to:r.to});
  if(!document.getElementById('sl-body'))return;
  if(error){el.innerHTML='<div class="alert-strip alert-danger"><div><div class="alert-label" style="color:var(--danger);">Gagal memuat laporan</div><div class="alert-body">'+esc(error.message)+'</div></div></div>';return;}
  _sel.range=r;
  _sel.rows=(data||[]).filter(x=>(x.status==='ok'||x.status==='terlewat')&&(r.shift==null||x.shift===r.shift));
  // daftar barista untuk filter (penanggung jawab di periode ini)
  const sel=document.getElementById('sl-bar'),prev=sel.value;
  const names=[...new Set(_sel.rows.map(respName).filter(Boolean))].sort();
  sel.innerHTML='<option value="">Semua barista</option>'+names.map(n=>'<option'+(n===prev?' selected':'')+'>'+esc(n)+'</option>').join('');
  drawSelisih();
}
function selRows(){
  const bar=(document.getElementById('sl-bar')||{}).value||'';
  return bar?_sel.rows.filter(r=>respName(r)===bar):_sel.rows;
}
const selTol=rows=>{for(const r of rows)for(const l of (r.lines||[]))if(l.tolerance_pct!=null)return +l.tolerance_pct;return _mr&&_mr.config?+_mr.config.lost_pct:10;};
// Status per bahan (dihitung database, lihat nirmala-selisih-jatah-loss.sql):
//   Selisih % = (stok sistem − stok fisik) ÷ stok sistem. Batas = Lost n break (10%), toleransi timbangan ±2 gr/ml
//   bocor = fisik KURANG > 10% (MERAH) · lebih = fisik LEBIH BANYAK > 10% (KUNING) · normal · kalibrasi = titik nol
const LINE_ST={
  bocor:{label:'Bocor',cls:'s-danger',dot:'dot-danger',bg:'rgba(255,154,168,.09)',xl:{fill:'FFC7CE',font:'9C0006'}},
  lebih:{label:'Perlu dicek',cls:'s-warn',dot:'dot-warn',bg:'rgba(244,194,122,.07)',xl:{fill:'FFEB9C',font:'9C5700'}},
  normal:{label:'Normal',cls:'s-ok',dot:'dot-ok',bg:'',xl:null},
  kalibrasi:{label:'Kalibrasi',cls:'',dot:'',bg:'',xl:{fill:'EDEDED',font:'595959'}},
};
const LINE_KET={bocor:'Fisik kurang dari sistem (nuang berlebih)',lebih:'Fisik lebih banyak dari sistem (indikasi restock tidak dicatat)',normal:'Selisih dalam batas wajar',kalibrasi:'Timbangan pertama (titik nol, tidak dihitung)'};
const lineStatus=l=>l.status||(l.prev_physical==null?'kalibrasi':(l.flagged?'bocor':'normal'));
const linePill=l=>{const s=LINE_ST[lineStatus(l)];
  return s.cls?'<span class="status-pill '+s.cls+'"><span class="dot '+s.dot+'"></span>'+s.label+'</span>'
    :'<span class="status-pill" style="background:rgba(255,255,255,.08);color:var(--mist);">'+s.label+'</span>';};
function sumLines(rows){
  const t={bocor:0,lebih:0,normal:0,kalibrasi:0,nBocor:0,nLebih:0,nKal:0};
  rows.filter(r=>r.status==='ok').forEach(r=>(r.lines||[]).forEach(l=>{
    const s=lineStatus(l),rp=+l.variance_rp||0;
    t[s]+=rp;if(s==='bocor')t.nBocor++;if(s==='lebih')t.nLebih++;if(s==='kalibrasi')t.nKal++;
  }));
  return t;
}
function drawSelisih(){
  const el=document.getElementById('sl-body');if(!el)return;
  const rowsData=selRows();
  const done=rowsData.filter(r=>r.status==='ok');
  const missed=rowsData.filter(r=>r.status==='terlewat').length;
  const T=sumLines(rowsData);
  const tol=selTol(rowsData);
  const rows=[...rowsData].reverse().map(r=>{
    const nm=n=>n?esc(n):(r.work_date===today()?'<span style="color:var(--warn);">menunggu clock in</span>':'<span style="color:var(--mist);">tidak ada clock in</span>');
    const who=r.check_type==='handover'
      ?nm(r.shift1)+' <span style="color:var(--mist);">→ '+(r.shift2?esc(r.shift2):'—')+'</span>'
      :nm(respName(r));
    const ls=r.lines||[],t=sumLines([r]);
    const allKal=ls.length&&t.nKal===ls.length;
    const val=r.status!=='ok'?'—'
      :allKal?'<span style="color:var(--mist);font-weight:400;">kalibrasi</span>'
      :'<span style="color:'+(t.bocor>0?'var(--danger)':'var(--ink)')+';">'+fmtRp(t.bocor)+'</span>'+
        (t.nLebih?'<div class="item-unit" style="color:var(--warn);">'+t.nLebih+' perlu dicek · '+fmtRp(t.lebih)+'</div>':'');
    let main='<tr><td><div class="item-name">'+esc(r.label)+'</div><div class="item-unit">'+esc(r.work_date)+' · Shift '+r.shift+'</div></td>'+
      '<td>'+who+'</td><td>'+statusTag(r)+'</td><td style="font-weight:700;">'+val+'</td></tr>';
    if(r.status!=='ok')return main;
    const order={bocor:0,lebih:1,normal:2,kalibrasi:3};
    const det=[...ls].sort((a,b)=>order[lineStatus(a)]-order[lineStatus(b)]||a.ingredient.localeCompare(b.ingredient)).map(l=>{
      const s=lineStatus(l),fix=r.is_latest?' <button class="btn-ghost" style="padding:4px 8px;font-size:10px;" data-c="'+esc(r.id)+'" data-i="'+esc(l.ingredient)+'" data-u="'+esc(l.unit||'')+'" data-v="'+esc(l.physical_qty)+'" onclick="fixLine(this.dataset)">koreksi</button>':'';
      const u=esc(l.unit||''),pct=l.leak_pct!=null?+l.leak_pct:(+l.variance_pct||0)*(+l.variance_qty<0?-1:1);
      const col=s==='bocor'?'var(--danger)':s==='lebih'?'var(--warn)':'inherit';
      return '<tr style="'+(LINE_ST[s].bg?'background:'+LINE_ST[s].bg+';':'')+'"><td style="padding:8px 0;">'+esc(l.ingredient)+fix+(l.reason?'<div class="item-unit">'+esc(l.reason)+'</div>':'')+'</td>'+
        '<td>'+fmtNum(Math.round(+l.system_qty*10)/10)+' '+u+'</td>'+
        '<td><strong>'+fmtNum(Math.round(+l.physical_qty*10)/10)+'</strong> '+u+'</td>'+
        '<td style="color:'+col+';">'+(+l.variance_qty>0?'+':'')+fmtNum(Math.round(+l.variance_qty*10)/10)+' '+u+'</td>'+
        '<td style="color:'+col+';font-weight:'+(s==='bocor'||s==='lebih'?700:400)+';">'+(s==='kalibrasi'||+l.system_qty<=0&&s!=='normal'?'—':(pct>0?'+':'')+(Math.round(pct*10)/10).toLocaleString('id-ID')+'%')+'</td>'+
        '<td style="color:'+col+';">'+(s==='kalibrasi'?'—':fmtRp(+l.variance_rp))+'</td>'+
        '<td>'+linePill(l)+(s==='bocor'||s==='lebih'?'<div class="item-unit" style="margin-top:4px;">'+LINE_KET[s]+'</div>':'')+'</td></tr>';
    }).join('');
    const sumTxt=allKal?'<span style="color:var(--mist);">titik nol, tidak dihitung</span>'
      :'<span style="color:'+(t.nBocor?'var(--danger)':'var(--green)')+';">'+t.nBocor+' bocor</span>'+(t.nLebih?' · <span style="color:var(--warn);">'+t.nLebih+' perlu dicek</span>':'')+(t.nKal?' · '+t.nKal+' kalibrasi':'');
    return main+'<tr><td colspan="4" style="padding:0 0 12px;"><details'+(t.nBocor||t.nLebih?' open':'')+'><summary style="cursor:pointer;font-size:12px;color:var(--mist);">'+ls.length+' bahan · '+sumTxt+'</summary>'+
      '<table class="data-table" style="margin-top:8px;font-size:12px;"><thead><tr><th>Bahan</th><th>Stok sistem</th><th>Stok fisik</th><th>Selisih</th><th>Selisih %</th><th>Nilai selisih</th><th>Status</th></tr></thead><tbody>'+det+'</tbody></table></details></td></tr>';
  }).join('');
  el.innerHTML='<div class="stat-strip">'+
    '<div class="stat-cell"><div class="stat-label">Kebocoran</div><div class="stat-value '+(T.bocor>0?'danger':'green')+'" style="font-size:22px;">'+fmtRp(T.bocor)+'</div><div class="stat-note">'+T.nBocor+' bahan kurang &gt; '+tol+'% dari stok sistem</div></div>'+
    '<div class="stat-cell"><div class="stat-label">Dalam batas '+tol+'%</div><div class="stat-value" style="font-size:22px;">'+fmtRp(T.normal)+'</div><div class="stat-note">wajar, sudah masuk loss &amp; break HPP</div></div>'+
    '<div class="stat-cell"><div class="stat-label">Perlu dicek</div><div class="stat-value '+(T.nLebih?'warn':'green')+'" style="font-size:22px;">'+fmtRp(T.lebih)+'</div><div class="stat-note">'+T.nLebih+' bahan fisik lebih banyak · restock tidak dicatat?</div></div>'+
    '<div class="stat-cell"><div class="stat-label">Cek</div><div class="stat-value">'+done.length+'<span style="font-size:15px;color:'+(missed?'var(--danger)':'var(--mist)')+';"> · '+missed+' terlewat</span></div><div class="stat-note">'+(T.nKal?T.nKal+' bahan kalibrasi (titik nol)':'tersimpan · terlewat')+'</div></div></div>'+
    (rows?'<table class="data-table"><thead><tr><th>Cek</th><th>Penanggung jawab</th><th>Status</th><th>Kebocoran</th></tr></thead><tbody>'+rows+'</tbody></table>'
      :'<div class="empty-state"><div class="empty-title">Belum ada cek stok di periode ini</div></div>')+
    '<div style="font-size:11px;color:var(--mist);margin-top:12px;line-height:1.7;">'+
    '<b>Selisih</b> = stok sistem − stok fisik, <b>Selisih %</b> = selisih ÷ stok sistem. <b>Bocor</b> = fisik kurang lebih dari '+tol+'% (batas = Lost n break di Pengaturan HPP), toleransi timbangan ±2 gr/ml. '+
    '<b>Perlu dicek</b> = fisik lebih banyak dari sistem: biasanya restock tidak dicatat, ada stok racikan lama, atau takaran resep kebesaran. '+
    '<b>Kalibrasi</b> = timbangan pertama bahan itu, jadi titik nol dan tidak dihitung.<br>'+
    'Penanggung jawab: Buka Pagi & Pergantian = barista shift 1, Closing = barista shift 2. Tombol koreksi hanya muncul di cek terakhir.</div>';
}
async function fixLine(d){
  const v=prompt('Angka fisik yang benar untuk '+d.i+' ('+d.u+'). Sekarang tercatat '+d.v+'.',d.v);
  if(v===null)return;
  if(v.trim()===''||isNaN(v)||+v<0){toast('Angka tidak valid','wrn');return;}
  const {error}=await sb.rpc('nc_fix_stock_line',{p_check_id:d.c,p_ingredient:d.i,p_physical:+v});
  if(error){toast('Gagal: '+error.message,'err');return;}
  toast('Dikoreksi. Stok '+d.i+' ikut disesuaikan','ok');
  await loadAllData();loadSelisih();
}
function exportSelisih(){
  const rs=selRows(),range=_sel.range;
  if(!range||!rs.length)return toast('Tidak ada data di periode ini','wrn');
  if(typeof XLSX==='undefined')return toast('Gagal memuat modul xlsx','err');
  const bar=document.getElementById('sl-bar').value;
  const tol=selTol(rs);
  const st={ok:'Tersimpan',terlewat:'TERLEWAT'};
  const T=sumLines(rs);
  const info=[['Laporan Selisih Stok · Nirmala Coffee'],['Periode',fmtTgl(range.from)+(range.to!==range.from?' – '+fmtTgl(range.to):'')+(range.capped?' (s/d hari ini)':'')],
    ['Jenis',range.desc],['Barista',bar||'Semua barista'],['Dibuat',today()],[],
    ['KEBOCORAN',T.bocor,T.nBocor+' bahan: fisik kurang > '+tol+'% dari stok sistem'],
    ['Dalam batas '+tol+'%',T.normal,'wajar, sudah masuk loss & break HPP'],
    ['Perlu dicek',T.lebih,T.nLebih+' bahan: fisik lebih banyak > '+tol+'% (restock tidak dicatat?)'],
    ['Kalibrasi',T.nKal+' bahan','titik nol, tidak dihitung'],[],
    ['KETERANGAN WARNA'],
    ['MERAH · Bocor','Fisik kurang dari sistem (nuang berlebih)','Selisih % di atas '+tol+'% dari stok sistem. Cek takaran barista, bahan tumpah/terbuang, atau menu yang tidak diinput di kasir.'],
    ['KUNING · Perlu dicek','Fisik lebih banyak dari sistem (indikasi restock)','Selisih % di atas '+tol+'%. Biasanya barang masuk tidak dicatat di tab Restock, atau takaran resep lebih besar dari yang dituang.'],
    ['ABU-ABU · Kalibrasi','Timbangan pertama bahan (titik nol)','Tidak dihitung dan tidak dibebankan ke barista.'],[]];
  const H1=info.length;
  const s1=[...info,['Tanggal','Shift','Cek','Status','Jam submit','Penanggung jawab','Barista shift 1','Barista shift 2','Bahan bocor','Kebocoran','Bahan perlu dicek','Perlu dicek']];
  // urutan kolom sama dengan laporan lama; kolom "Merah" diganti "Status"
  const s2=[['Tanggal','Shift','Cek','Penanggung jawab','Bahan','Satuan','Stok sistem','Stok fisik','Selisih','Selisih %','Status','Keterangan','Harga/satuan','Nilai selisih','Pemakaian resep','Pemakaian aktual','Restock masuk','Botol segel','Berat kotor (gr)','Catatan']];
  const s2st=[];
  const byIng={},byBar={};
  rs.forEach(r=>{
    const who=respName(r)||'(tidak ada data clock in)';
    const ls=r.lines||[],t=sumLines([r]);
    s1.push([r.work_date,r.shift,r.label,st[r.status],r.submitted_at||'',who,r.shift1||'',r.shift2||'',r.status==='ok'?t.nBocor:'',r.status==='ok'?t.bocor:'',r.status==='ok'?t.nLebih:'',r.status==='ok'?t.lebih:'']);
    const b=byBar[who]||(byBar[who]={cek:0,miss:0,nb:0,rp:0,nl:0,rpl:0});
    if(r.status==='ok'){b.cek++;b.nb+=t.nBocor;b.rp+=t.bocor;b.nl+=t.nLebih;b.rpl+=t.lebih;}else b.miss++;
    const order={bocor:0,lebih:1,normal:2,kalibrasi:3};
    [...ls].sort((a,b)=>order[lineStatus(a)]-order[lineStatus(b)]||a.ingredient.localeCompare(b.ingredient)).forEach(l=>{
      const s=lineStatus(l),sys=+l.system_qty,pct=l.leak_pct!=null?+l.leak_pct:(sys>0?+((sys-l.physical_qty)/sys*100).toFixed(2):'');
      s2.push([r.work_date,r.shift,r.label,who,l.ingredient,l.unit,+sys.toFixed(2),+(+l.physical_qty).toFixed(2),+(+l.variance_qty).toFixed(2),
        s==='kalibrasi'?'':pct,LINE_ST[s].label.toUpperCase(),s==='normal'?'':LINE_KET[s].replace('batas wajar','batas '+tol+'%'),+l.unit_price,s==='kalibrasi'?'':+l.variance_rp,
        l.usage_theoretical==null?'':+(+l.usage_theoretical).toFixed(2),l.usage_actual==null?'':+(+l.usage_actual).toFixed(2),+l.restock_in||0,
        l.sealed_count==null?'':+l.sealed_count,l.gross_weight==null?'':+l.gross_weight,l.reason||'']);
      s2st.push(s);
      if(s==='kalibrasi')return;
      const g=byIng[l.ingredient]||(byIng[l.ingredient]={unit:l.unit,sys:0,var:0,rp:0,nb:0,nl:0});
      g.var+=+l.variance_qty||0;g.rp+=+l.variance_rp||0;if(s==='bocor')g.nb++;if(s==='lebih')g.nl++;
    });
  });
  s1.push([],['','','','','','','','','TOTAL',T.bocor,'',T.lebih]);
  const s3=[['Bahan','Satuan','Total selisih','Kali bocor','Kali perlu dicek','Nilai selisih']];
  const s3st=[];
  Object.entries(byIng).sort((a,b)=>b[1].rp-a[1].rp).forEach(([k,v])=>{
    s3.push([k,v.unit,+v.var.toFixed(2),v.nb,v.nl,v.rp]);s3st.push(v.nb?'bocor':v.nl?'lebih':'normal');
  });
  const s4=[['Penanggung jawab','Cek tersimpan','Cek terlewat','Bahan bocor','Kebocoran','Bahan perlu dicek','Perlu dicek']];
  Object.entries(byBar).sort((a,b)=>b[1].rp-a[1].rp).forEach(([k,v])=>s4.push([k,v.cek,v.miss,v.nb,v.rp,v.nl,v.rpl]));

  // ── format & warna (xlsx-js-style). Rupiah tetap angka, jadi masih bisa dijumlah/difilter.
  const RP='"Rp"#,##0;-"Rp"#,##0',RP2='"Rp"#,##0.00',PCT='0.00"%";-0.00"%"',NUM='#,##0.##';
  const HEAD={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'2F3B32'}}};
  const look=c=>c?{fill:{patternType:'solid',fgColor:{rgb:c.fill}},font:{color:{rgb:c.font},bold:true}}:{};
  const cell=(ws,r,c)=>{const a=XLSX.utils.encode_cell({r,c});if(!ws[a])ws[a]={t:'s',v:''};return ws[a];};
  const paint=(ws,r,ncol,base)=>{for(let c=0;c<ncol;c++){const x=cell(ws,r,c);x.s=Object.assign({},x.s||{},base);}};
  const fmt=(ws,r,cols,z)=>cols.forEach(c=>{const x=cell(ws,r,c);if(typeof x.v==='number'){x.z=z;x.s=Object.assign({},x.s||{},{numFmt:z});}});
  const wb=XLSX.utils.book_new();
  const add=(name,aoa,w,fn)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=w.map(x=>({wch:x}));if(fn)fn(ws);XLSX.utils.book_append_sheet(wb,ws,name);};
  add('Ringkasan Cek',s1,[22,44,18,12,10,22,16,16,11,14,16,14],ws=>{
    paint(ws,0,3,{font:{bold:true,sz:14}});
    paint(ws,6,3,T.bocor>0?look(LINE_ST.bocor.xl):{font:{bold:true}});
    paint(ws,8,3,T.nLebih?look(LINE_ST.lebih.xl):{});
    paint(ws,11,1,{font:{bold:true}});paint(ws,12,3,look(LINE_ST.bocor.xl));paint(ws,13,3,look(LINE_ST.lebih.xl));paint(ws,14,3,look(LINE_ST.kalibrasi.xl));
    [6,7,8].forEach(r=>fmt(ws,r,[1],RP));
    paint(ws,H1,12,HEAD);
    rs.forEach((r,i)=>{const t=sumLines([r]),row=H1+1+i;
      paint(ws,row,12,r.status==='terlewat'||t.nBocor?look(LINE_ST.bocor.xl):t.nLebih?look(LINE_ST.lebih.xl):{});fmt(ws,row,[9,11],RP);});
    fmt(ws,s1.length-1,[9,11],RP);paint(ws,s1.length-1,12,{font:{bold:true}});fmt(ws,s1.length-1,[9,11],RP);
  });
  add('Detail Bahan',s2,[12,7,17,20,18,7,12,12,11,11,13,52,13,15,15,15,13,11,15,32],ws=>{
    paint(ws,0,20,HEAD);
    s2st.forEach((s,i)=>{const r=i+1;paint(ws,r,20,look(LINE_ST[s].xl));fmt(ws,r,[6,7,8,14,15,16],NUM);fmt(ws,r,[9],PCT);fmt(ws,r,[12],RP2);fmt(ws,r,[13],RP);});
    ws['!autofilter']={ref:'A1:T'+s2.length};
  });
  add('Per Bahan',s3,[18,8,14,11,15,15],ws=>{paint(ws,0,6,HEAD);s3st.forEach((s,i)=>{paint(ws,i+1,6,look(LINE_ST[s].xl));fmt(ws,i+1,[2],NUM);fmt(ws,i+1,[5],RP);});});
  add('Per Barista',s4,[24,14,13,12,15,16,15],ws=>{paint(ws,0,7,HEAD);s4.slice(1).forEach((x,i)=>{paint(ws,i+1,7,x[3]?look(LINE_ST.bocor.xl):x[5]?look(LINE_ST.lebih.xl):{});fmt(ws,i+1,[4,6],RP);});});
  const slug=bar?'-'+bar.toLowerCase().replace(/[^\w]+/g,'-'):'';
  XLSX.writeFile(wb,'nirmala-selisih-'+range.label+slug+'.xlsx');
  toast('Excel berhasil diexport','ok');
}

// ══ OWNER: MENU & RESEP (HPP, margin, bahan & harga beli, resep batch, biaya marketing) ══
// Semua perhitungan HPP ada di database (nc_menu_cost). Halaman ini menampilkan & mengirim perubahan
// lewat fungsi database (nc_menu_save, nc_batch_save, ...) supaya validasi & pencatatannya di satu tempat.
const KIND_LABEL={stok:'Stok',hpp:'Hanya HPP',kemasan:'Kemasan',racikan:'Racikan'};
const KIND_HELP={stok:'dipotong kasir & ditimbang saat cek stok',hpp:'hanya untuk hitung harga (mint, buah & gula bahan sirup)',kemasan:'otomatis masuk HPP tiap cup',racikan:'dibuat di tempat, saat checkout dipecah ke bahan aslinya'};
let _mr=null,_mrIng=[],_mrEdit=null,_mrBatch=null;
const pct=n=>(n==null?'—':(Math.round(n*10)/10).toLocaleString('id-ID')+'%');
function marginLevel(m){
  if(!_mr)return'';const c=_mr.config;
  if(m==null)return'merah';
  return m>=+c.target_margin?'hijau':m>=+c.min_margin?'kuning':'merah';
}
function marginPill(m,active){
  if(active===false)return '<span class="status-pill" style="background:rgba(255,255,255,.08);color:var(--mist);">Nonaktif</span>';
  const l=marginLevel(m),cls={hijau:'s-ok',kuning:'s-warn',merah:'s-danger'}[l],dot={hijau:'dot-ok',kuning:'dot-warn',merah:'dot-danger'}[l];
  return '<span class="status-pill '+cls+'"><span class="dot '+dot+'"></span>'+pct(m)+'</span>';
}
function renderMenuTab(){setTimeout(loadMenuTab,0);
  return '<div class="page-header"><div class="page-title">Menu & Resep</div><div class="page-subtitle">HPP dihitung otomatis dari harga beli bahan terbaru. Harga jual tetap kamu yang tentukan.</div></div>'+
    '<div id="mr-body">Memuat…</div>';}
async function loadMenuTab(){
  const [o,i]=await Promise.all([sb.rpc('nc_menu_overview'),sb.from('nc_ingredient').select('*').order('name')]);
  const el=document.getElementById('mr-body');if(!el)return;
  if(o.error){el.innerHTML='<div class="alert-strip alert-danger"><div><div class="alert-label" style="color:var(--danger);">Gagal memuat Menu & Resep</div><div class="alert-body">'+esc(o.error.message)+'<br>Pastikan file SQL menu sudah dijalankan di Supabase.</div></div></div>';return;}
  _mr=o.data;_mrIng=i.data||[];drawMenuTab();
}
function mrSorted(){
  const rank={merah:0,kuning:1,hijau:2};
  return [..._mr.menus].sort((a,b)=>{
    if(a.active!==b.active)return a.active?-1:1;
    const ra=rank[marginLevel(a.cost.margin)],rb=rank[marginLevel(b.cost.margin)];
    if(ra!==rb)return ra-rb;
    return (a.cost.margin??-999)-(b.cost.margin??-999);
  });
}
function drawMenuTab(){
  const el=document.getElementById('mr-body');if(!el||!_mr)return;
  const c=_mr.config,act=_mr.menus.filter(m=>m.active);
  const red=act.filter(m=>marginLevel(m.cost.margin)==='merah').length,yel=act.filter(m=>marginLevel(m.cost.margin)==='kuning').length;
  const avg=act.length?act.reduce((s,m)=>s+(+m.cost.margin||0),0)/act.length:0;
  const sec=(t,sub)=>'<div style="margin:48px 0 16px;"><div class="page-title" style="font-size:20px;">'+t+'</div>'+(sub?'<div class="page-subtitle">'+sub+'</div>':'')+'</div>';
  const rows=mrSorted().map(m=>{
    const cs=m.cost,saranBeda=m.active&&cs.saran>m.price;
    return '<tr style="cursor:pointer;'+(m.active?'':'opacity:.55;')+'" data-n="'+esc(m.name)+'" onclick="openMenuEdit(this.dataset.n)">'+
      '<td><div class="item-name">'+esc(m.name)+'</div><div class="item-unit">'+esc(m.category||'-')+'</div></td>'+
      '<td>'+fmtRp(cs.hpp)+'<div class="item-unit">bahan '+fmtRp(cs.bahan)+'</div></td>'+
      '<td><strong>'+fmtRp(+m.price)+'</strong></td>'+
      '<td>'+marginPill(cs.margin,m.active)+'</td>'+
      '<td style="'+(saranBeda?'color:var(--warn);':'color:var(--mist);')+'">'+fmtRp(cs.saran)+(saranBeda?'<div class="item-unit">+'+fmtRp(cs.saran-m.price)+'</div>':'')+'</td>'+
      '<td><button class="btn-ghost" style="padding:8px 14px;">Edit</button></td></tr>';
  }).join('');
  el.innerHTML=
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;"><button class="btn-sm" onclick="openMenuEdit(null)">+ Menu baru</button><button class="btn-ghost" onclick="exportMenu()">⬇ Excel</button></div>'+
    '<div class="stat-strip">'+
      '<div class="stat-cell"><div class="stat-label">Menu aktif</div><div class="stat-value">'+act.length+'</div><div class="stat-note">'+(_mr.menus.length-act.length)+' nonaktif</div></div>'+
      '<div class="stat-cell"><div class="stat-label">Rata-rata margin</div><div class="stat-value '+(avg>=+c.target_margin?'green':avg>=+c.min_margin?'warn':'danger')+'">'+pct(avg)+'</div><div class="stat-note">target ≥ '+pct(+c.target_margin)+'</div></div>'+
      '<div class="stat-cell"><div class="stat-label">Di bawah target</div><div class="stat-value '+(yel?'warn':'green')+'">'+yel+'</div><div class="stat-note">margin '+pct(+c.min_margin)+' – '+pct(+c.target_margin)+'</div></div>'+
      '<div class="stat-cell"><div class="stat-label">Margin tipis</div><div class="stat-value '+(red?'danger':'green')+'">'+red+'</div><div class="stat-note">margin &lt; '+pct(+c.min_margin)+'</div></div></div>'+
    '<table class="data-table"><thead><tr><th>Menu</th><th>HPP</th><th>Harga jual</th><th>Margin</th><th>Saran harga</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="font-size:11px;color:var(--mist);margin-top:10px;">HPP = bahan + '+pct(+c.lost_pct)+' lost n break + '+pct(+c.utility_pct)+' air & listrik + kemasan. Saran harga = harga minimal agar margin ≥ '+pct(+c.target_margin)+', dibulatkan ke atas ke Rp1.000. Klik menu untuk mengubah harga atau resep.</div>'+
    sec('Bahan & harga beli','Ubah harga di sini → HPP semua menu langsung ikut berubah. Harga baru berlaku mulai hari ini; cek stok yang sudah lewat tetap memakai harga lama.')+
    '<div id="mr-ing"></div>'+
    sec('Buatan sendiri','Sirup & racikan dihitung dari resep batch: harga per satuan = total bahan 1 batch ÷ hasil. Kalau harga lemon/gula naik, harga sirup ikut naik.')+
    '<div id="mr-batch"></div>'+
    sec('Biaya marketing','Produksi untuk event (mis. tepache Public Cupping Season). Tidak masuk kasir & omzet.')+
    '<div id="mr-mkt"></div>'+
    sec('Pengaturan HPP')+'<div id="mr-cfg"></div>'+
    sec('Riwayat perubahan','30 perubahan terakhir')+'<div id="mr-log"></div>';
  drawIngredients();drawBatches();drawMarketing();drawMenuConfig();drawMenuLog();
}

// ── Bahan & harga beli ──
function ingInfo(n){return (_mr.ingredients||[]).find(x=>x.name===n)||{};}
function drawIngredients(){
  const el=document.getElementById('mr-ing');if(!el)return;
  const inp=(pre,x,val,ph,w)=>'<input class="form-input" style="margin:0;padding:8px;width:'+(w||90)+'px;min-height:40px;" id="'+pre+'-'+cid(x.name)+'" type="number" step="any" min="0" value="'+(val==null?'':esc(val))+'" placeholder="'+ph+'">';
  const order={stok:0,racikan:1,hpp:2,kemasan:3};
  const list=[..._mrIng].sort((a,b)=>(a.active===b.active?0:a.active?-1:1)||(order[a.kind]??9)-(order[b.kind]??9)||a.name.localeCompare(b.name));
  const rows=list.map(x=>{
    const inf=ingInfo(x.name),hasBatch=+x.batch_yield>0,used=(inf.used_by||[]).length;
    const price=hasBatch
      ?fmtRp(+inf.unit_price)+'/'+esc(x.unit)+'<div class="item-unit">dari resep batch</div>'
      :((+inf.unit_price>0?fmtRp(+inf.unit_price)+'/'+esc(x.unit):'<span style="color:var(--danger);">belum ada</span>')+
        '<div style="display:flex;gap:4px;margin-top:6px;" data-n="'+esc(x.name)+'" data-u="'+esc(x.unit)+'" oninput="pricePreview(this)">'+inp('pp',x,null,'Harga Rp',100)+inp('ps',x,null,'Isi '+esc(x.unit),80)+'</div>'+
        '<div class="item-unit" id="pv-'+cid(x.name)+'" style="margin-top:4px;"></div>');
    const stokOnly=x.kind==='stok';
    return '<tr'+(x.active?'':' style="opacity:.5;"')+'><td><div class="item-name">'+esc(x.name)+'</div><div class="item-unit">'+esc(x.unit)+(used?' · dipakai '+used+' menu':'')+'</div></td>'+
      '<td><select class="form-input" id="kind-'+cid(x.name)+'" style="margin:0;min-height:40px;padding:8px;width:130px;">'+Object.entries(KIND_LABEL).map(([k,l])=>'<option value="'+k+'"'+(x.kind===k?' selected':'')+'>'+l+'</option>').join('')+'</select></td>'+
      '<td>'+price+'</td>'+
      '<td>'+(stokOnly?inp('rop',x,x.rop,'ROP',80):'<span class="item-unit">—</span>')+'</td>'+
      '<td>'+(stokOnly?'<div style="display:flex;gap:4px;">'+inp('tare',x,x.tare_g||'','Kosong',80)+inp('full',x,x.full_gross_g,'Penuh',80)+inp('cont',x,x.full_content,'Isi',70)+'</div>':'<span class="item-unit">—</span>')+'</td>'+
      '<td style="text-align:center;"><input type="checkbox" id="act-'+cid(x.name)+'"'+(x.active?' checked':'')+'></td>'+
      '<td><button class="btn-sm" data-n="'+esc(x.name)+'" onclick="saveIngredient(this.dataset.n)">Simpan</button></td></tr>';
  }).join('');
  el.innerHTML='<div class="page-subtitle" style="margin-bottom:12px;">'+Object.entries(KIND_LABEL).map(([k,l])=>'<strong>'+l+'</strong>: '+KIND_HELP[k]).join(' · ')+'<br>'+
    '<strong>Botol</strong> (khusus stok dalam botol kaca): Kosong = berat botol kosong (gr), Penuh = berat 1 botol segel (gr), Isi = isi bersih sesuai label.</div>'+
    '<table class="data-table"><thead><tr><th>Bahan</th><th>Jenis</th><th>Harga/satuan · ubah harga</th><th>ROP</th><th>Botol: kosong · penuh · isi</th><th>Aktif</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;align-items:center;"><input class="form-input" id="nb-n" placeholder="Bahan baru" style="margin:0;max-width:220px;"><input class="form-input" id="nb-u" placeholder="Satuan (gr/ml/pcs)" style="margin:0;max-width:170px;">'+
    '<select class="form-input" id="nb-k" style="margin:0;max-width:160px;">'+Object.entries(KIND_LABEL).map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join('')+'</select><button class="btn-sm" onclick="addIngredient()">Tambah</button></div>';
}
function pricePreview(box){
  const n=box.dataset.n,u=box.dataset.u,pp=document.getElementById('pp-'+cid(n)).value,ps=document.getElementById('ps-'+cid(n)).value;
  const el=document.getElementById('pv-'+cid(n));
  el.innerHTML=(+pp>0&&+ps>0)?'→ harga baru <strong>'+fmtRp(Math.round(+pp/+ps*100)/100)+'/'+esc(u)+'</strong>, berlaku mulai hari ini':'';
}
async function saveIngredient(n){
  const g=k=>document.getElementById(k+'-'+cid(n));
  const v=k=>g(k)?g(k).value:'';
  const numOrNull=s=>s===''?null:+s;
  const x=_mrIng.find(i=>i.name===n)||{},inf=ingInfo(n),used=(inf.used_by||[]);
  const upd={kind:v('kind')||x.kind,active:g('act').checked};
  if(upd.kind==='stok'){Object.assign(upd,{rop:+v('rop')||0,tare_g:+v('tare')||0,full_gross_g:numOrNull(v('full')),full_content:numOrNull(v('cont'))});}
  if(upd.tare_g>0&&upd.full_gross_g!=null&&upd.full_gross_g<=upd.tare_g){toast('Berat botol penuh harus lebih besar dari botol kosong','wrn');return;}
  if(upd.kind==='kemasan'&&used.length){toast(n+' masih dipakai di resep '+used.join(', ')+'. Hapus dulu dari resep.','wrn');return;}
  if(!upd.active&&x.active&&used.length&&!confirm(n+' masih dipakai di: '+used.join(', ')+'.\nTetap nonaktifkan? (Resepnya tidak berubah, tapi bahan ini tidak muncul di cek stok)'))return;
  const {error}=await sb.from('nc_ingredient').update(upd).eq('name',n);
  if(error)return toast('Gagal: '+error.message,'err');
  if(upd.kind==='stok'){await sb.from('nc_inventory').upsert({name:n,stock:getInv()[n]??0,updated_at:new Date().toISOString()},{onConflict:'name'});}
  const pp=v('pp'),ps=v('ps');
  if(pp!==''||ps!==''){
    if(!(+pp>=0)||!(+ps>0)){toast('Pengaturan tersimpan, tapi harga butuh harga kemasan & isi kemasan','wrn');}
    else{
      // 1 harga per bahan per hari: kalau hari ini sudah diubah, yang lama diganti
      const t=today();
      const d=await sb.from('nc_ingredient_price').delete().eq('ingredient',n).eq('effective_from',t);
      if(d.error)return toast('Gagal simpan harga: '+d.error.message,'err');
      const r=await sb.from('nc_ingredient_price').insert({ingredient:n,pack_price:+pp,pack_size:+ps,effective_from:t});
      if(r.error)return toast('Gagal simpan harga: '+r.error.message,'err');
    }
  }
  toast(n+' tersimpan. HPP menu ikut diperbarui','ok');
  await loadAllData();loadMenuTab();}
async function addIngredient(){
  const n=document.getElementById('nb-n').value.trim(),u=document.getElementById('nb-u').value.trim(),k=document.getElementById('nb-k').value;
  if(!n||!u){toast('Isi nama & satuan','wrn');return;}
  if(/[,()"]/.test(n)){toast('Nama bahan tidak boleh memakai koma, kurung, atau kutip','wrn');return;}
  const {error}=await sb.from('nc_ingredient').insert({name:n,unit:u,kind:k});
  if(error)return toast('Gagal: '+(/duplicate|unique/i.test(error.message)?'bahan "'+n+'" sudah ada':error.message),'err');
  await saveStock(n,0); // baris nc_inventory wajib ada supaya bahan bisa dipakai di resep
  toast(n+' ditambahkan. Isi harganya di tabel','ok');
  await loadAllData();loadMenuTab();}

  return '<option value="">Pilih bahan…</option>'+groups.map(([k,l])=>{
    const xs=(_mr.ingredients||[]).filter(i=>i.kind===k&&(i.active||i.name===sel));
    return xs.length?'<optgroup label="'+l+'">'+xs.map(i=>'<option value="'+esc(i.name)+'"'+(i.name===sel?' selected':'')+'>'+esc(i.name)+' ('+esc(i.unit)+')</option>').join('')+'</optgroup>':'';
  }).join('');
}

    '<button class="btn-ghost" style="margin:6px 0 18px;" onclick="menuLineAdd()">+ Bahan</button>'+
    '<div id="me-calc" class="alert-strip alert-warn" style="display:block;"></div>'+
    '<div class="modal-actions">'+(m?'<button class="btn-ghost" style="color:var(--danger);border-color:rgba(255,154,168,.5);" onclick="menuArchive()">Hapus dari kasir</button>':'')+

  drawMenuLines();showModal();

function drawMenuLines(){
  const el=document.getElementById('me-lines');if(!el)return;

    const inf=ingInfo(l.ingredient);

// ── [5] FUNGSI PENGIRIMAN EMAIL ─────────────────────────────────────────────

/**
 * Kirim email alert stok kritis ke semua penerima di ALERT_RECIPIENTS
 * menggunakan Brevo Transactional Email API (v3).
 *
 * Fungsi ini bersifat async dan tidak memblokir UI.
 * Error pengiriman dicatat di console dan toast, tapi tidak melempar exception.
 *
 * @param {string} itemName  - Nama bahan yang kritis
 * @param {number} stock     - Stok aktual saat ini
 * @param {string} unit      - Satuan (gr, ml, pcs, dll)
 * @param {number} rop       - Nilai Reorder Point
 */
async function sendStockWarningEmail(itemName, stock, unit, rop) {
  const subject = `[ALERT INVENTARIS] Stok ${itemName} Kritis — Segera Restock!`;
  const htmlContent = buildEmailHtml(itemName, stock, unit, rop);

  // Format "to" sesuai struktur Brevo API
  const toList = ALERT_RECIPIENTS.map(r => ({ name: r.name, email: r.email }));

  const payload = {
    sender:      EMAIL_SENDER,
    to:          toList,
    subject:     subject,
    htmlContent: htmlContent,
  };

  try {
    const response = await fetch('/api/send-email', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(payload),
    });

    if (!response.ok) {
      // Jika API mengembalikan error, log detailnya
      const errData = await response.json().catch(() => ({}));
      console.error('[ROP Alert] Gagal kirim email. Status:', response.status, errData);
      // Tampilkan toast error jika fungsi toast tersedia di scope global
      if (typeof toast === 'function') {
        toast(`Gagal kirim notifikasi email untuk ${itemName}`, 'err');
      }
      return false;
    }

    console.log(`[ROP Alert] ✓ Email terkirim ke ${toList.length} penerima untuk: ${itemName}`);
    return true;

  } catch (networkError) {
    // Network error (offline, CORS, dll)
    console.error('[ROP Alert] Network error saat kirim email:', networkError);
    return false;
  }
}


// ── [6] FUNGSI UTAMA: PENGECEKAN ROP + TRIGGER EMAIL ───────────────────────

/**
 * Periksa semua item inventaris terhadap nilai ROP masing-masing.
 * Jika stok <= ROP DAN belum pernah dinotifikasi (lock belum aktif),
 * kirim email alert dan aktifkan lock.
 *
 * Fungsi ini juga secara otomatis mereset lock untuk item yang
 * stoknya sudah kembali di atas ROP (hasil restock).
 *
 * ═══════════════════════════════════════════════════════════
 *  Dipanggil setelah submitRestock() dan setelah Cek Stok tersimpan.
 *  ROP tiap bahan dibaca dari nc_ingredient.rop (Pengaturan Bahan).
 * ═══════════════════════════════════════════════════════════
 */
function checkInventoryROP() {
  const inv = getInv();

  // INVENTORY_DEF harus tersedia di scope global (sudah ada di index.html)
  if (typeof INVENTORY_DEF === 'undefined') {
    console.warn('[ROP Alert] INVENTORY_DEF tidak ditemukan. Pastikan file ini dimuat setelah index.html.');
    return;
  }

  INVENTORY_DEF.forEach(item => {
    const stock = inv[item.name] ?? 0;
    const rop   = item.rop;

    // Lewati item yang tidak memiliki nilai ROP numerik
    if (!rop || typeof rop !== 'number') return;

    if (stock <= rop) {
      // ── Stok di bawah atau sama dengan ROP ──

      if (!isLocked(item.name)) {
        // Lock belum aktif → ini PERTAMA KALI stok menyentuh ROP
        // Kirim email (non-blocking, async) lalu segera aktifkan lock
        sendStockWarningEmail(item.name, stock, item.unit, rop)
          .then(success => {
            if (success) {
              // Aktifkan lock HANYA jika email berhasil terkirim
              activateLock(item.name);
              console.log(`[ROP Alert] Lock diaktifkan untuk: ${item.name}`);
              if (typeof toast === 'function') {
                toast(`⚠ Alert email terkirim: ${item.name} kritis!`, 'wrn');
              }
            }
            // Jika gagal: lock TIDAK diaktifkan → sistem akan coba lagi
            // pada transaksi berikutnya (behavior yang diharapkan)
          });
      }
      // Jika sudah locked → abaikan, email tidak dikirim ulang

    } else {
      // ── Stok sudah di atas ROP (hasil restock) ──
      // Reset lock agar alert bisa terkirim lagi jika stok turun kembali
      releaseLock(item.name);
    }
  });
}
