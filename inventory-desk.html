<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nirmala Coffee</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --ink:#111110;--ink2:#3a3a38;--mist:#8a8a86;--border:#ddddd8;
  --cream:#f5f3ee;--paper:#faf9f6;--white:#ffffff;
  --green:#2a5c3f;--green2:#3d7a57;--warn:#b85c00;--danger:#991b1b;
}
body{font-family:'Libre Franklin',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ── LOGIN ── */
#login-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--ink);}
.login-left{background:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:56px;position:relative;overflow:hidden;}
.login-left::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(42,92,63,0.35) 0%,transparent 65%);pointer-events:none;}
.login-right{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:56px;}
.login-logo{height:80px;width:auto;object-fit:contain;filter:brightness(0) invert(1);position:relative;z-index:1;}
.login-tagline{font-size:13px;color:rgba(255,255,255,0.35);letter-spacing:2.5px;text-transform:uppercase;position:relative;z-index:1;}
.login-form{width:100%;max-width:360px;}
.login-form h2{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;margin-bottom:8px;}
.login-form p{font-size:14px;color:var(--mist);margin-bottom:40px;}
.role-card{border:1.5px solid var(--border);border-radius:4px;padding:20px 24px;cursor:pointer;transition:all 0.2s;margin-bottom:12px;background:var(--white);display:flex;align-items:center;gap:16px;}
.role-card:hover{border-color:var(--ink2);}
.role-card.selected{border-color:var(--ink);background:var(--ink);color:var(--paper);}
.role-card.selected .role-sub{color:rgba(255,255,255,0.5);}
.role-icon{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.role-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;}
.role-sub{font-size:12px;color:var(--mist);margin-top:2px;}
.pin-field{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:4px;padding:16px 20px;font-size:26px;letter-spacing:10px;text-align:center;font-family:'Playfair Display',serif;color:var(--ink);margin-bottom:12px;transition:border-color 0.2s;}
.pin-field:focus{outline:none;border-color:var(--ink);}
.pin-error{font-size:13px;color:var(--danger);margin-bottom:12px;display:none;}
.btn-login{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:4px;padding:17px 24px;font-family:'Libre Franklin',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background 0.2s;}
.btn-login:hover{background:var(--ink2);}
.pin-hint{font-size:12px;color:var(--mist);text-align:center;margin-top:20px;}
@media(max-width:700px){#login-page{grid-template-columns:1fr}.login-left{display:none}.login-right{padding:40px 28px}}

/* ── APP ── */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:100;}
.topbar-logo{height:34px;width:auto;object-fit:contain;margin-right:32px;flex-shrink:0;}
.topbar-nav{display:flex;gap:0;flex:1;}
.nav-link{padding:0 20px;height:60px;display:flex;align-items:center;font-size:13px;font-weight:500;letter-spacing:0.5px;color:var(--mist);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none;font-family:'Libre Franklin',sans-serif;}
.nav-link:hover{color:var(--ink);}
.nav-link.active{color:var(--ink);border-bottom-color:var(--ink);}
.topbar-right{display:flex;align-items:center;gap:16px;margin-left:auto;}
.role-pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--border);border-radius:100px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all 0.15s;letter-spacing:0.3px;}
.role-pill:hover{border-color:var(--ink);color:var(--ink);}
.role-pill.owner-pill{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.role-pill.owner-pill:hover{background:var(--ink2);}

/* ── MAIN ── */
.main{flex:1;padding:40px 32px;max-width:1200px;width:100%;margin:0 auto;}
.page-header{margin-bottom:36px;}
.page-title{font-family:'Playfair Display',serif;font-size:36px;font-weight:900;color:var(--ink);letter-spacing:-0.5px;line-height:1.1;}
.page-subtitle{font-size:14px;color:var(--mist);margin-top:6px;}

/* ── STAT STRIP ── */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:36px;}
.stat-cell{background:var(--white);padding:24px 28px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mist);margin-bottom:10px;}
.stat-value{font-family:'Playfair Display',serif;font-size:34px;font-weight:900;color:var(--ink);line-height:1;}
.stat-value.danger{color:var(--danger);}
.stat-value.warn{color:var(--warn);}
.stat-value.green{color:var(--green);}
.stat-note{font-size:12px;color:var(--mist);margin-top:6px;}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse;}
.data-table thead tr{border-bottom:2px solid var(--ink);}
.data-table th{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mist);padding:0 0 14px 0;text-align:left;}
.data-table th:not(:first-child){padding-left:20px;}
.data-table tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s;}
.data-table tbody tr:hover{background:var(--cream);}
.data-table td{padding:16px 0;font-size:14px;vertical-align:middle;}
.data-table td:not(:first-child){padding-left:20px;}
.item-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--ink);}
.item-unit{font-size:12px;color:var(--mist);margin-top:2px;}

/* ── STATUS ── */
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:0.5px;}
.s-ok{background:rgba(42,92,63,0.1);color:var(--green);}
.s-warn{background:rgba(184,92,0,0.1);color:var(--warn);}
.s-danger{background:rgba(153,27,27,0.1);color:var(--danger);}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot-ok{background:var(--green);}
.dot-warn{background:var(--warn);animation:blink 1.8s infinite;}
.dot-danger{background:var(--danger);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.stock-bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;width:120px;}
.stock-bar{height:100%;border-radius:2px;transition:width 0.4s ease;}

/* ── BARISTA INPUT ── */
.input-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.input-card{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:24px;transition:border-color 0.15s;}
.input-card:hover{border-color:var(--ink2);}
.input-card-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;}
.input-card-stock{font-size:12px;color:var(--mist);margin-bottom:16px;}
.input-row{display:flex;gap:8px;align-items:center;}
.qty-input{flex:1;border:1.5px solid var(--border);border-radius:4px;padding:12px 14px;font-size:18px;font-family:'Playfair Display',serif;font-weight:700;color:var(--ink);background:var(--cream);transition:border-color 0.15s,background 0.15s;text-align:right;width:100%;}
.qty-input:focus{outline:none;border-color:var(--ink);background:var(--white);}
.unit-label{font-size:13px;color:var(--mist);min-width:28px;}
.deduct-btn{background:var(--ink);color:var(--paper);border:none;border-radius:4px;padding:12px 20px;font-family:'Libre Franklin',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background 0.15s;}
.deduct-btn:hover{background:var(--green);}

/* ── RESTOCK ── */
.restock-trigger{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;background:var(--white);border:1px solid var(--border);border-radius:4px;margin-bottom:10px;transition:border-color 0.15s;}
.restock-trigger:hover{border-color:var(--ink2);}
.restock-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;}
.restock-stock{font-size:12px;color:var(--mist);margin-top:3px;}

/* ── BUTTONS ── */
.btn-sm{background:var(--ink);color:var(--paper);border:none;border-radius:4px;padding:10px 18px;font-family:'Libre Franklin',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background 0.15s;white-space:nowrap;flex-shrink:0;}
.btn-sm:hover{background:var(--green);}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border);border-radius:4px;padding:10px 18px;font-family:'Libre Franklin',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all 0.15s;}
.btn-ghost:hover{border-color:var(--ink);}
.btn-full{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:4px;padding:15px 24px;font-family:'Libre Franklin',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background 0.15s;}
.btn-full:hover{background:var(--green);}
.btn-full.danger{background:var(--danger);}
.btn-full.danger:hover{background:#7f1d1d;}

/* ── ALERTS ── */
.alert-strip{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;border-radius:4px;margin-bottom:20px;border-left:3px solid;}
.alert-danger{background:rgba(153,27,27,0.06);border-color:var(--danger);}
.alert-warn{background:rgba(184,92,0,0.06);border-color:var(--warn);}
.alert-label{font-size:13px;font-weight:600;}
.alert-body{font-size:12px;margin-top:3px;color:var(--mist);line-height:1.5;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(17,17,16,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px);}
.modal-box{background:var(--paper);border-radius:4px;padding:40px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:modalIn 0.2s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;margin-bottom:24px;color:var(--ink);}
.form-label{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mist);margin-bottom:8px;}
.form-input{width:100%;border:1.5px solid var(--border);border-radius:4px;padding:13px 16px;font-size:15px;font-family:'Libre Franklin',sans-serif;color:var(--ink);background:var(--white);margin-bottom:20px;transition:border-color 0.15s;}
.form-input:focus{outline:none;border-color:var(--ink);}
.modal-actions{display:flex;gap:10px;margin-top:8px;}

/* ── TOAST ── */
#toaster{position:fixed;top:72px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:var(--paper);padding:14px 18px;border-radius:4px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;max-width:320px;animation:toastIn 0.25s ease;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
.toast.ok{border-left:3px solid var(--green);}
.toast.err{border-left:3px solid var(--danger);}
.toast.wrn{border-left:3px solid var(--warn);}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.hidden{display:none !important;}

/* ── FORECAST ── */
.forecast-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.forecast-card{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:28px;}
.fc-title{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mist);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.consumption-item{padding:10px 0;border-bottom:1px solid var(--border);}
.consumption-item:last-child{border-bottom:none;}
.consumption-bar-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.consumption-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;}
.consumption-val{font-size:12px;color:var(--mist);}
.consumption-bar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.consumption-bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease;}

/* ── MENU GAUGE ── */
.menu-gauge-list{display:flex;flex-direction:column;gap:0;}
.menu-gauge-item{padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;}
.menu-gauge-item:last-child{border-bottom:none;}
.menu-gauge-item:hover{background:var(--cream);margin:0 -4px;padding:12px 4px;border-radius:3px;}
.mgauge-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.mgauge-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;}
.mgauge-label{font-size:11px;font-weight:600;text-align:right;}
.mgauge-sub{font-size:10px;color:var(--mist);margin-top:1px;}
.mgauge-bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.mgauge-bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
.mgauge-bottleneck{font-size:10px;color:var(--mist);margin-top:3px;}

/* ── MATH BOX ── */
.math-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.math-row:last-child{border-bottom:none;}
.math-row.bottleneck{background:rgba(153,27,27,0.04);margin:0 -8px;padding:8px 8px;border-radius:3px;}
.math-formula{font-family:monospace;font-size:11px;background:var(--cream);padding:10px 14px;border-radius:4px;line-height:1.8;margin-top:12px;}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--mist);}
.empty-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--ink2);margin-bottom:8px;}
.empty-text{font-size:14px;line-height:1.6;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .main{padding:16px 14px}
  .stat-strip{grid-template-columns:1fr 1fr}
  .input-grid{grid-template-columns:1fr}
  .forecast-grid{grid-template-columns:1fr}
  .topbar{padding:0 12px;height:52px;}
  .topbar-logo{height:26px;margin-right:8px;}
  .topbar-nav{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:1;}
  .topbar-nav::-webkit-scrollbar{display:none;}
  .nav-link{padding:0 10px;font-size:11px;height:52px;flex-shrink:0;}
  .role-pill{padding:5px 10px;font-size:11px;gap:4px;flex-shrink:0;}
  .data-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .modal-box{padding:24px 20px;}
  #toaster{right:12px;left:12px;}
  .toast{max-width:100%;}
  #owner-stat-strip{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:0;background:var(--border);border:1px solid var(--border);border-radius:4px;}
  #owner-stat-strip::-webkit-scrollbar{display:none;}
  #owner-stat-strip .stat-cell{min-width:160px;flex-shrink:0;}
}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="login-page">
  <div class="login-left">
    <img id="login-logo" class="login-logo" alt="N">
    <div class="login-tagline">Inventory & Operations</div>
  </div>
  <div class="login-right">
    <div class="login-form">
      <h2>Selamat datang.</h2>
      <p>Pilih role dan masukkan PIN untuk melanjutkan.</p>
      <div class="role-card selected" id="rc-barista" onclick="selectRole('barista')">
        <div class="role-icon">☕</div>
        <div><div class="role-name">Barista</div><div class="role-sub">Input stok & restock harian</div></div>
      </div>
      <div class="role-card" id="rc-owner" onclick="selectRole('owner')">
        <div class="role-icon">◎</div>
        <div><div class="role-name">Owner</div><div class="role-sub">Dashboard, laporan & forecast</div></div>
      </div>
      <div style="margin-top:28px;margin-bottom:6px;">
        <label class="form-label" style="margin-bottom:8px;">PIN Akses</label>
        <input type="password" class="pin-field" id="pin-input" maxlength="4" placeholder="— — — —" autocomplete="off">
        <div class="pin-error" id="pin-error">PIN salah. Coba lagi.</div>
      </div>
      <button class="btn-login" onclick="attemptLogin()">Masuk →</button>
      <div class="pin-hint">Barista: 1234 &nbsp;·&nbsp; </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <img id="topbar-logo" class="topbar-logo" alt="N">
    <div class="topbar-nav" id="nav-tabs"></div>
    <div class="topbar-right">
      <div class="role-pill" id="role-pill" onclick="logout()">
        <span id="pill-icon">☕</span>
        <span id="pill-label">Barista</span>
        <span style="color:var(--border);margin:0 2px;">·</span>
        <span style="font-weight:400;color:var(--mist);">Keluar</span>
      </div>
    </div>
  </div>
  <div class="main" id="main-content"></div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modal-inner"></div>
  </div>
</div>
<div id="toaster"></div>

// ══ UNIT PRICES — Rp per satuan (gr / ml / pcs) ══
// Rumus: Harga Beli Kemasan ÷ Isi Kemasan = Harga per Satuan
// Contoh: Arabica Rp 90.000 / 100 gr = Rp 900 per gr
const UNIT_PRICES = {
  'blend':          180,   // Rp 90.000 / 100 gr
  'Creamer':         80,   // Rp 40.000 / 500 gr
  'Susu':            14.3,   // Rp 20.000 / 1.000 ml
  'SKM':             40,   // Rp 20.000 / 500 ml
  'Pistachio':      250,   // Rp 75.000 / 300 ml
  'Matcha':        250,   // Rp 125.000 / 50 gr
  'V60':           200,   // Rp 100.000 / 50 gr
  'Soda':          3500,   // Rp 3.500 / pcs
  'Mix Berry':      180,   // Rp 54.000 / 300 ml
  'Lemon':          100,   // Rp 30.000 / 300 ml
  'Jeruk nipis':   1500,   // Rp 1.500 / pcs
};

// Nilai Aset = Σ (Stok Tersisa × Harga per Satuan)
function calcAssetValue(){
  const inv=getInv();
  return INVENTORY_DEF.reduce((sum,item)=>{
    const stock=inv[item.name]??0;           // stok tersisa
    const hargaSatuan=UNIT_PRICES[item.name]??0; // Rp per gr/ml/pcs
    return sum+(stock*hargaSatuan);          // nilai bahan ini
  },0);
}
// ══ STORAGE — Supabase ══
async function loadAllData(){
  const [invRes,restockRes,salesRes]=await Promise.all([
    sb.from('nc_inventory').select('*'),
    sb.from('nc_restock').select('*').order('ts',{ascending:false}),
    sb.from('nc_sales').select('*').order('ts',{ascending:false}),
  ]);
  _inv={};
  (invRes.data||[]).forEach(r=>_inv[r.name]=parseFloat(r.stock)||0);
  _restock=restockRes.data||[];
  _sales=salesRes.data||[];
}
function getInv(){return _inv||{};}
function getRestock(){return _restock||[];}
function getSales(){return _sales||[];}
async function saveStock(name,stock){
  await sb.from('nc_inventory').upsert({name,stock,updated_at:new Date().toISOString()},{onConflict:'name'});
  _inv[name]=stock;
}
async function addSale(row){await sb.from('nc_sales').insert(row);(_sales=_sales||[]).unshift(row);}
async function addRestock(row){await sb.from('nc_restock').insert(row);(_restock=_restock||[]).unshift(row);}


// ══ LOGIN ══
let role='barista',tab='',selRole='barista';
function selectRole(r){
  selRole=r;
  document.getElementById('rc-barista').classList.toggle('selected',r==='barista');
  document.getElementById('rc-owner').classList.toggle('selected',r==='owner');
}
function attemptLogin(){
  const pin=document.getElementById('pin-input').value.trim();
  if(pin===PINS[selRole]){
    role=selRole;
    document.getElementById('login-page').style.display='none';
    const app=document.getElementById('app');
    app.style.display='flex';app.style.flexDirection='column';
    setupApp();
  } else {
    document.getElementById('pin-error').style.display='block';
    document.getElementById('pin-input').value='';
  }
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const lp=document.getElementById('login-page');
    if(lp&&lp.style.display!=='none')attemptLogin();
  }
});
function logout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-page').style.display='grid';
  document.getElementById('pin-input').value='';
  document.getElementById('pin-error').style.display='none';
}

// ══ APP SETUP ══
async function setupApp(){
  document.getElementById('pill-icon').textContent=role==='owner'?'◎':'☕';
  document.getElementById('pill-label').textContent=role==='owner'?'Owner':'Barista';
  document.getElementById('role-pill').className='role-pill'+(role==='owner'?' owner-pill':'');
  const tabs=role==='barista'
    ?[['input','Input Stok'],['restock','Restock'],['stok','Lihat Stok']]
    :[['dashboard','Dashboard'],['inventory','Inventory'],['forecast','Forecast']];
  const startTab=tabs[0][0];
  document.getElementById('nav-tabs').innerHTML=tabs.map(([id,label])=>
    '<button class="nav-link'+(id===startTab?' active':'')+'" onclick="switchTab(\''+id+'\')">'+label+'</button>'
  ).join('');
  tab=startTab;
  toast('Memuat data…','ok');

  await loadRopLock();
  render();
}

// ══ HELPERS ══
function itemDef(name){return INVENTORY_DEF.find(i=>i.name===name);}
function stockStatus(name){
  const inv=getInv(),stock=inv[name]??0,def=itemDef(name);
  if(!def)return'ok';
  if(def.ropLabel==='Warning')return stock<=0?'danger':'warn';
  if(def.ropLabel==='Aman')return'ok';
  if(!def.rop)return'ok';
  if(stock<def.rop)return'danger';
  if(stock<def.rop*1.25)return'warn';
  return'ok';
}
function statusPill(name){
  const s=stockStatus(name);
  const m={ok:['s-ok','dot-ok','Aman'],warn:['s-warn','dot-warn','Perhatian'],danger:['s-danger','dot-danger','Kritis']};
  const[cls,dcls,label]=m[s];
  return '<span class="status-pill '+cls+'"><span class="dot '+dcls+'"></span>'+label+'</span>';
}
function stockBar(name){
  const inv=getInv(),def=itemDef(name),stock=inv[name]??0;
  if(!def||!def.rop)return'';
  const pct=Math.min(100,(stock/(def.rop*2))*100);
  const s=stockStatus(name);
  const color=s==='danger'?'var(--danger)':s==='warn'?'var(--warn)':'var(--green)';
  return '<div class="stock-bar-wrap"><div class="stock-bar" style="width:'+pct+'%;background:'+color+';"></div></div>';
}
function today(){return new Date().toISOString().split('T')[0];}
function fmt(n){return n.toLocaleString('id-ID');}
function fmtNum(n){return n%1===0?n:n.toFixed(1);}

// ══ BARISTA: INPUT STOK ══
function renderInput(){
  const inv=getInv();
  const redItems=INVENTORY_DEF.filter(i=>stockStatus(i.name)==='danger');

  if(redItems.length)alert='<div class="alert-strip alert-danger"><div><div class="alert-label" style="color:var(--danger);">Stok Kritis — Segera Restock</div><div class="alert-body">'+redItems.map(i=>i.name).join(' · ')+'</div></div></div>';
  const cards=INVENTORY_DEF.map(item=>{
    const stock=inv[item.name]??0;
    const s=stockStatus(item.name);
    const dc=s==='danger'?'dot-danger':s==='warn'?'dot-warn':'dot-ok';
    const id='in-'+item.name.replace(/\s+/g,'_');
    return '<div class="input-card">'+
      '<div class="input-card-name">'+item.name+'<span class="dot '+dc+'" style="width:8px;height:8px;"></span></div>'+
      '<div class="input-card-stock">Sisa: <strong>'+fmtNum(stock)+'</strong> '+item.unit+'</div>'+
      '<div class="input-row">'+
        '<input type="number" class="qty-input" id="'+id+'" placeholder="0" min="0" step="0.5" onkeydown="if(event.key===\'Enter\')deductItem(\''+item.name+'\',\''+item.unit+'\')">'+
        '<span class="unit-label">'+item.unit+'</span>'+
        '<button class="deduct-btn" onclick="deductItem(\''+item.name+'\',\''+item.unit+'\')">− Kurangi</button>'+
      '</div>'+
    '</div>';
  }).join('');
  return '<div class="page-header"><div class="page-title">Input Stok.</div><div class="page-subtitle">Kurangi stok bahan baku secara manual</div></div>'+alert+'<div class="input-grid">'+cards+'</div>';
}
async function deductItem(name,unit){
  const el=document.getElementById('in-'+name.replace(/\s+/g,'_'));
  const val=parseFloat(el.value);
  if(!val||val<=0){toast('Masukkan jumlah yang valid','wrn');return;}
  const cur=(_inv||{})[name]??0;
  if(val>cur){toast('Stok '+name+' tidak cukup (ada '+fmtNum(cur)+' '+unit+')','err');return;}
  const newStock=Math.max(0,cur-val);
  try{
    await saveStock(name,newStock);
    await addSale({date:today(),ts:Date.now(),type:'manual',item:name,qty:val,unit});
    checkInventoryROP();
    toast('− '+val+' '+unit+' '+name+' dikurangi','ok');
    el.value='';render();
  }catch(e){toast('Gagal: '+e.message,'err');}
}

async function submitRestock(name,unit){
  const qty=parseFloat(document.getElementById('m-qty').value);
  const priceRaw=document.getElementById('m-price-raw').value;
  const price=priceRaw?parseInt(priceRaw,10):0;
  const note=document.getElementById('m-note').value.trim();
  if(!qty||qty<=0){toast('Masukkan jumlah yang valid','wrn');return;}
  const newStock=((_inv||{})[name]??0)+qty;
  try{
    await saveStock(name,newStock);
    await addRestock({date:today(),ts:Date.now(),item:name,unit,qty,price,note});
    checkInventoryROP();
    const priceStr=price>0?fmtRp(price):'';
    toast('+ '+qty+' '+unit+' '+name+(priceStr?' · '+priceStr:''),'ok');
    closeModal();render();

// ══ OWNER: FORECAST ══
function renderForecast(){
  const sales=getSales(), inv=getInv();

  // Build 7-day usage map
  const days7=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-i);
    return d.toISOString().split('T')[0];
  });
  const usage={};
  sales.filter(s=>s.type==='manual'&&days7.includes(s.date)).forEach(s=>{
    if(!usage[s.item])usage[s.item]={};
    usage[s.item][s.date]=(usage[s.item][s.date]||0)+s.qty;
  });

  // ── PANEL 1: Consumption Rate ──
  const totalUsage=Object.entries(usage).map(([name,dmap])=>{
    const total=Object.values(dmap).reduce((a,b)=>a+b,0);
    const def=itemDef(name);
    const active=Object.keys(dmap).length;
    return{name,total,unit:def?def.unit:'',active,avgDay:total/7};
  }).filter(i=>i.total>0).sort((a,b)=>b.total-a.total);

  const maxU=totalUsage.length?totalUsage[0].total:1;
  const consumptionHTML=totalUsage.slice(0,10).map((item,i)=>{
    const pct=Math.min(100,(item.total/maxU)*100);
    const barColor=i===0?'var(--ink)':i<=2?'var(--ink2)':'var(--mist)';
    return '<div class="consumption-item">'+
      '<div class="consumption-bar-label">'+
        '<span class="consumption-name">'+item.name+'</span>'+
        '<span class="consumption-val">'+item.total.toFixed(1)+' '+item.unit+' · avg '+item.avgDay.toFixed(1)+'/hari</span>'+
      '</div>'+
      '<div class="consumption-bar-track"><div class="consumption-bar-fill" style="width:'+pct+'%;background:'+barColor+';"></div></div>'+
    '</div>';
  }).join('');

  // ── PANEL 2: Days of Stock Remaining — PER MENU ──
  const menuAnalysis=Object.entries(RECIPES).map(([menuName,recipe])=>{
    let maxPortions=Infinity;
    let limitIng=null;

    Object.entries(recipe).forEach(([ing,amt])=>{
      const stock=inv[ing]??0;
      const possible=amt>0?Math.floor(stock/amt):Infinity;
      if(possible<maxPortions){maxPortions=possible;limitIng=ing;}
    });
    if(maxPortions===Infinity)maxPortions=0;

    // Days until limiting ingredient depletes (based on avg daily usage)
    const limStock=limitIng?(inv[limitIng]??0):0;
    const limAvgDay=limitIng&&usage[limitIng]
      ?Object.values(usage[limitIng]).reduce((a,b)=>a+b,0)/7
      :0;
    const daysLeft=limAvgDay>0?limStock/limAvgDay:Infinity;

    // Per-ingredient portion calc for detail modal
    const ingCalc=Object.entries(recipe).map(([ing,amt])=>{
      const stock=inv[ing]??0;
      const portions=amt>0?Math.floor(stock/amt):9999;
      const def=itemDef(ing);
      const unit=def?def.unit:'';
      const avgD=usage[ing]?Object.values(usage[ing]).reduce((a,b)=>a+b,0)/7:0;
      return{ing,amt,stock,portions,unit,isBottleneck:ing===limitIng,avgD};
    });

    return{menuName,maxPortions,limitIng,limStock,limAvgDay,daysLeft,ingCalc};
  }).sort((a,b)=>{
    if(a.maxPortions===0&&b.maxPortions!==0)return-1;
    if(b.maxPortions===0&&a.maxPortions!==0)return 1;
    const da=a.daysLeft===Infinity?9999:a.daysLeft;
    const db=b.daysLeft===Infinity?9999:b.daysLeft;
    if(da!==db)return da-db;
    return a.maxPortions-b.maxPortions;
  });

  const menuGaugeHTML=menuAnalysis.map(m=>{
    let color,label,pct,sublabel;
    const d=m.daysLeft;
    if(m.maxPortions===0){
      color='var(--danger)';label='Tidak bisa dibuat';pct=0;sublabel='Stok habis';
    } else if(d===Infinity){
      color='var(--green)';label=m.maxPortions+' porsi';pct=100;sublabel='Data pemakaian belum ada';
    } else if(d<1){
      color='var(--danger)';label='< 1 hari';pct=3;sublabel=m.maxPortions+' porsi tersisa';
    } else if(d<3){
      color='var(--danger)';label='~'+d.toFixed(1)+' hari';pct=Math.min(95,d/14*100);sublabel=m.maxPortions+' porsi tersisa';
    } else if(d<7){
      color='var(--warn)';label='~'+d.toFixed(1)+' hari';pct=Math.min(95,d/14*100);sublabel=m.maxPortions+' porsi tersisa';
    } else {
      color='var(--green)';label='~'+Math.floor(d)+' hari';pct=Math.min(95,d/14*100);sublabel=m.maxPortions+' porsi tersisa';
    }
    const enc=encodeURIComponent(JSON.stringify(m));
    return '<div class="menu-gauge-item" onclick="showMenuDetail(\''+enc+'\')">'+
      '<div class="mgauge-top">'+
        '<div><div class="mgauge-name">'+m.menuName+'</div>'+
        (m.limitIng?'<div class="mgauge-sub">Bottleneck: '+m.limitIng+'</div>':'')+'</div>'+
        '<div><div class="mgauge-label" style="color:'+color+';">'+label+'</div>'+
        '<div class="mgauge-sub">'+sublabel+'</div></div>'+
      '</div>'+
      '<div class="mgauge-bar-track"><div class="mgauge-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'+
    '</div>';
  }).join('');

// ── MENU DETAIL MODAL dengan math lengkap ──
function showMenuDetail(enc){
  const m=JSON.parse(decodeURIComponent(enc));
  const inv=getInv();

  // Rebuild ingCalc fresh from current inv (enc might be stale)
  const recipe=RECIPES[m.menuName]||{};
  let minPortion=Infinity, bottleneckIng=null;
  Object.entries(recipe).forEach(([ing,amt])=>{
    const stock=inv[ing]??0;
    const p=amt>0?Math.floor(stock/amt):9999;
    if(p<minPortion){minPortion=p;bottleneckIng=ing;}
  });
  if(minPortion===Infinity)minPortion=0;

  // Ingredient rows
  const ingRows=Object.entries(recipe).map(([ing,amt])=>{
    const stock=inv[ing]??0;
    const portions=amt>0?Math.floor(stock/amt):999;
    const def=itemDef(ing);
    const unit=def?def.unit:'';
    const isB=ing===bottleneckIng;
    return '<div class="math-row'+(isB?' bottleneck':'')+'">'+
      '<div style="font-size:13px;'+(isB?'font-weight:700;color:var(--danger);':'')+'">'+
        (isB?'⚠ ':'')+ing+
      '</div>'+
      '<div style="text-align:right;font-size:12px;color:var(--mist);">'+
        fmtNum(stock)+' '+unit+' ÷ '+amt+' '+unit+'/porsi = <strong style="color:'+(isB?'var(--danger)':'var(--ink)')+';">'+portions+' porsi</strong>'+
      '</div>'+
    '</div>';
  }).join('');

  // Days formula
  let daysHTML='<div style="font-size:12px;color:var(--mist);background:var(--cream);padding:12px;border-radius:4px;margin-top:12px;">Belum ada data historis pemakaian. Catat pengurangan stok agar prediksi hari tersedia.</div>';

  if(m.limAvgDay>0 && bottleneckIng){
    const limStock=inv[bottleneckIng]??0;
    const def=itemDef(bottleneckIng);
    const unit=def?def.unit:'';
    const days=(limStock/m.limAvgDay);
    daysHTML='<div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mist);margin:16px 0 8px;">Prediksi Ketahanan (Berdasarkan '+bottleneckIng+')</div>'+
      '<div class="math-formula">'+
        'Stok '+bottleneckIng+' saat ini = '+fmtNum(limStock)+' '+unit+'<br>'+
        'Avg pemakaian harian (7 hari) = '+m.limAvgDay.toFixed(2)+' '+unit+'/hari<br>'+
        '─────────────────────────────────<br>'+
        fmtNum(limStock)+' ÷ '+m.limAvgDay.toFixed(2)+' = <strong>'+days.toFixed(1)+' hari</strong>'+
        (minPortion>0?'<br><br>Pada laju ini, menu ini bisa dibuat ±<strong>'+Math.floor(days * (m.limAvgDay / (recipe[bottleneckIng]||1)))+' porsi</strong> lagi sebelum stok habis':'')
      +'</div>';
  }

  document.getElementById('modal-inner').innerHTML=
    '<div class="modal-title">'+m.menuName+'</div>'+
    '<div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mist);margin-bottom:12px;">Kalkulasi Porsi per Bahan</div>'+
    '<div style="background:var(--cream);border-radius:4px;padding:12px 16px;margin-bottom:4px;">'+ingRows+'</div>'+
    '<div style="background:var(--ink);color:var(--paper);border-radius:4px;padding:16px 20px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;">'+
      '<div><div style="font-size:11px;opacity:0.5;letter-spacing:1px;margin-bottom:4px;">TOTAL PORSI TERSISA</div>'+
      '<div style="font-family:\'Playfair Display\',serif;font-size:28px;font-weight:900;">'+minPortion+'<span style="font-size:14px;font-weight:400;opacity:0.6;margin-left:4px;">porsi</span></div></div>'+
      (bottleneckIng?'<div style="text-align:right;font-size:12px;opacity:0.6;">Dibatasi oleh<br><strong>'+bottleneckIng+'</strong></div>':'')+
    '</div>'+
    daysHTML+
    '<div class="modal-actions" style="margin-top:20px;"><button class="btn-full" onclick="closeModal()">Tutup</button></div>';

  showModal();
}

// ══ EXPORT CSV (REVISED) ══
function exportCSV(){
  const inv=getInv(), restock=getRestock(), sales=getSales();
  
  // Menambahkan 'sep=;' di awal agar Excel otomatis tahu pemisah kolomnya adalah titik koma
  let csv = 'sep=;\n'; 
  csv += 'NIRMALA COFFEE DATA EXPORT;\n';
  csv += 'Diekspor: ' + new Date().toLocaleString('id-ID') + ';\n\n';
  
  // === INVENTORY & VALUASI ASET ===
  csv += '=== INVENTORY & VALUASI ASET ===;;;;;;\n';
  csv += 'Bahan;Stok;Satuan;ROP;Status;Harga Satuan (Rp);Nilai Aset (Rp)\n';
  
  INVENTORY_DEF.forEach(i => {
    const stock = inv[i.name] ?? 0;
    const hp = UNIT_PRICES[i.name] ?? 0;
    
    // Menggunakan titik koma (;) dan membungkus string dengan kutip ganda jika ada koma/spasi
    csv += '"' + i.name + '";' + 
           stock + ';' + 
           '"' + i.unit + '";' + 
           '"' + (i.ropLabel || i.rop || '—') + '";' + 
           '"' + stockStatus(i.name) + '";' + 
           hp + ';' + 
           (stock * hp).toFixed(0) + '\n';
  });
  
  csv += '\nTotal Nilai Aset (Rp);' + calcAssetValue().toFixed(0) + ';;;;;\n\n';
  
  // === RESTOCK LOG ===
  csv += '=== RESTOCK LOG ===;;;;;\n';
  csv += 'Tanggal;Bahan;Qty;Satuan;Harga Beli (Rp);Catatan\n';
  restock.forEach(r => {
    csv += '"' + r.date + '";"' + r.item + '";' + r.qty + ';"' + r.unit + '";' + (r.price || 0) + ';"' + (r.note || '') + '"\n';
  });
  
  csv += '\n=== AKTIVITAS STOK ===;;;\n';
  csv += 'Tanggal;Bahan;Qty;Satuan\n';
  sales.forEach(s => {
    csv += '"' + s.date + '";"' + (s.item || '') + '";' + (s.qty || '') + ';"' + (s.unit || '') + '"\n';
  });
  
  // Tambahkan BOM (Byte Order Mark) UTF-8 agar karakter spesial/aksen terbaca dengan sempurna di Excel
  const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
  
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nirmala-' + today() + '.csv';
  a.click();
  toast('CSV berhasil diexport', 'ok');
}

// ── [5] FUNGSI PENGIRIMAN EMAIL ─────────────────────────────────────────────

/**
 * Kirim email alert stok kritis ke semua penerima di ALERT_RECIPIENTS
 * menggunakan Brevo Transactional Email API (v3).
 *
 * Fungsi ini bersifat async dan tidak memblokir UI.
 * Error pengiriman dicatat di console dan toast, tapi tidak melempar exception.
 *
 * @param {string} itemName  - Nama bahan yang kritis
 * @param {number} stock     - Stok aktual saat ini
 * @param {string} unit      - Satuan (gr, ml, pcs, dll)
 * @param {number} rop       - Nilai Reorder Point
 */
async function sendStockWarningEmail(itemName, stock, unit, rop) {
  const subject = `[ALERT INVENTARIS] Stok ${itemName} Kritis — Segera Restock!`;
  const htmlContent = buildEmailHtml(itemName, stock, unit, rop);

  // Format "to" sesuai struktur Brevo API
  const toList = ALERT_RECIPIENTS.map(r => ({ name: r.name, email: r.email }));

  const payload = {
    sender:      EMAIL_SENDER,
    to:          toList,
    subject:     subject,
    htmlContent: htmlContent,
  };

  try {
    const response = await fetch('/api/send-email', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(payload),
    });

    if (!response.ok) {
      // Jika API mengembalikan error, log detailnya
      const errData = await response.json().catch(() => ({}));
      console.error('[ROP Alert] Gagal kirim email. Status:', response.status, errData);
      // Tampilkan toast error jika fungsi toast tersedia di scope global
      if (typeof toast === 'function') {
        toast(`Gagal kirim notifikasi email untuk ${itemName}`, 'err');
      }
      return false;
    }

    console.log(`[ROP Alert] ✓ Email terkirim ke ${toList.length} penerima untuk: ${itemName}`);
    return true;

  } catch (networkError) {
    // Network error (offline, CORS, dll)
    console.error('[ROP Alert] Network error saat kirim email:', networkError);
    return false;
  }
}


// ── [6] FUNGSI UTAMA: PENGECEKAN ROP + TRIGGER EMAIL ───────────────────────

/**
 * Periksa semua item inventaris terhadap nilai ROP masing-masing.
 * Jika stok <= ROP DAN belum pernah dinotifikasi (lock belum aktif),
 * kirim email alert dan aktifkan lock.
 *
 * Fungsi ini juga secara otomatis mereset lock untuk item yang
 * stoknya sudah kembali di atas ROP (hasil restock).
 *
 * ═══════════════════════════════════════════════════════════
 *  KAPAN MEMANGGIL FUNGSI INI?
 *  Sisipkan: checkInventoryROP()  TEPAT SETELAH baris:
 *
 *    sv('nc_inv', inv);   ← di dalam fungsi deductItem()
 *
 *  Contoh posisi di deductItem():
 *    inv[name] = Math.max(0, cur - val);
 *    sv('nc_inv', inv);
 *    checkInventoryROP();   ← ← ← TAMBAHKAN DI SINI
 *    const sales = getSales();
 *    ...
 *
 *  Opsional: panggil juga di submitRestock() setelah sv('nc_inv', inv)
 *  agar lock langsung dilepas ketika stok sudah cukup.
 * ═══════════════════════════════════════════════════════════
 */
function checkInventoryROP() {
  const inv = getInv();

  // INVENTORY_DEF harus tersedia di scope global (sudah ada di index.html)
  if (typeof INVENTORY_DEF === 'undefined') {
    console.warn('[ROP Alert] INVENTORY_DEF tidak ditemukan. Pastikan file ini dimuat setelah index.html.');
    return;
  }

  INVENTORY_DEF.forEach(item => {
    const stock = inv[item.name] ?? 0;
    const rop   = item.rop;

    // Lewati item yang tidak memiliki nilai ROP numerik
    if (!rop || typeof rop !== 'number') return;

    if (stock <= rop) {
      // ── Stok di bawah atau sama dengan ROP ──

      if (!isLocked(item.name)) {
        // Lock belum aktif → ini PERTAMA KALI stok menyentuh ROP
        // Kirim email (non-blocking, async) lalu segera aktifkan lock
        sendStockWarningEmail(item.name, stock, item.unit, rop)
          .then(success => {
            if (success) {
              // Aktifkan lock HANYA jika email berhasil terkirim
              activateLock(item.name);
              console.log(`[ROP Alert] Lock diaktifkan untuk: ${item.name}`);
              if (typeof toast === 'function') {
                toast(`⚠ Alert email terkirim: ${item.name} kritis!`, 'wrn');
              }
            }
            // Jika gagal: lock TIDAK diaktifkan → sistem akan coba lagi
            // pada transaksi berikutnya (behavior yang diharapkan)
          });
      }
      // Jika sudah locked → abaikan, email tidak dikirim ulang

    } else {
      // ── Stok sudah di atas ROP (hasil restock) ──
      // Reset lock agar alert bisa terkirim lagi jika stok turun kembali
      releaseLock(item.name);
    }
  });
}
