<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121210">
<title>Nirmala Coffee</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- xlsx-js-style: SheetJS 0.18.5 + dukungan warna sel (untuk highlight merah di Excel) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
/* Tampilan mengikuti halaman Absensi: latar gelap dengan burst hijau, Helvetica Neue,
   kotak transparan bergaris tipis. Dioptimalkan untuk tablet operasional. */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  /* nama variabel lama dipertahankan supaya style di dalam JS ikut berubah */
  --ink:#FFFFFF;          /* teks utama & tombol solid */
  --ink2:#DCE3DC;         /* hover tombol solid */
  --mist:#9AA19A;         /* teks redup */
  --border:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.28);
  --fill:rgba(255,255,255,.05);
  --cream:rgba(255,255,255,.05);
  --white:rgba(255,255,255,.05);
  --paper:#121210;        /* teks di atas tombol putih */
  --panel:#171F19;        /* modal */
  --green:#9FD8B4;--green2:#7FC79C;--warn:#F4C27A;--danger:#FF9AA8;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html{background:#121210;-webkit-text-size-adjust:100%;}
body{font-family:var(--sans);background:transparent;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 65% at 38% 50%,#212E24 0%,#18211A 45%,#121210 100%);}
#login-page,#app{position:relative;z-index:1;}
input::placeholder{color:#7C837C;}
select option{background:#1A211C;color:#fff;}

/* ── BRAND & JAM (sama dengan Absensi) ── */
.brand{display:flex;align-items:center;gap:12px;}
.brand img{height:46px;width:auto;display:block;filter:brightness(0) invert(1);}
.brand b{display:block;font:700 14px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;}
.brand small{display:block;margin-top:7px;font:10px/1 var(--sans);letter-spacing:.4em;color:var(--mist);}
.clock{text-align:right;}
.clock b{display:block;font:700 15px var(--sans);letter-spacing:.06em;}
.clock span{display:block;margin-top:3px;font-size:10px;color:var(--mist);}

/* ── LOGIN ── */
#login-page{min-height:100vh;display:flex;flex-direction:column;}
.login-head{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 32px 12px;}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 24px 48px;}
.login-form{width:100%;max-width:420px;}
.login-form h2{font:400 26px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;}
.login-form p{font-size:13px;line-height:1.6;color:var(--mist);margin-bottom:28px;}
.role-card{border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:all 0.15s;margin-bottom:12px;background:transparent;display:flex;align-items:center;gap:16px;}
.role-card:hover{border-color:#fff;}
.role-card.selected{border-color:#fff;background:#fff;color:#121210;}
.role-card.selected .role-sub{color:#4A524B;}
.role-icon{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.role-name{font:700 14px var(--sans);letter-spacing:.2em;text-transform:uppercase;}
.role-sub{font-size:12px;color:var(--mist);margin-top:6px;}
.pin-field{width:100%;background:var(--fill);border:1px solid var(--line);border-radius:12px;padding:16px 20px;font:400 26px var(--sans);letter-spacing:10px;text-align:center;color:var(--ink);margin-bottom:12px;transition:border-color 0.2s;}
.pin-field:focus{outline:none;border-color:#fff;}
.pin-error{font-size:13px;color:var(--danger);margin-bottom:12px;display:none;}
.btn-login{width:100%;background:#fff;color:#121210;border:1px solid #fff;border-radius:100px;padding:17px 24px;font:700 13px var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;}
.btn-login:active{opacity:.85;}

/* ── APP ── */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:100;background:rgba(18,18,16,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:calc(14px + env(safe-area-inset-top,0px)) 32px 12px;}
.topbar-row{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto;}
.topbar-row2{display:flex;align-items:center;gap:12px;max-width:1200px;margin:14px auto 0;}
.topbar-nav{display:flex;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none;}
.topbar-nav::-webkit-scrollbar{display:none;}
.nav-link{flex-shrink:0;padding:11px 20px;border-radius:100px;border:1px solid var(--line);background:transparent;font:700 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink);cursor:pointer;white-space:nowrap;}
.nav-link.active{background:#fff;color:#121210;border-color:#fff;}
.topbar-right{display:flex;align-items:center;margin-left:auto;}
.role-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-radius:100px;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);cursor:pointer;white-space:nowrap;}
.role-pill.owner-pill{border-color:#fff;}

/* ── MAIN ── */
.main{flex:1;padding:32px 32px 48px;max-width:1200px;width:100%;margin:0 auto;}
.page-header{margin-bottom:28px;}
.page-title{font:400 26px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);}
.page-subtitle{font-size:13px;line-height:1.6;color:var(--mist);margin-top:6px;}

/* ── STAT STRIP ── */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px;}
.stat-cell{background:var(--fill);border:1px solid var(--line);border-radius:16px;padding:20px 22px;}
.stat-label{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);margin-bottom:10px;}
.stat-value{font:400 32px/1.1 var(--sans);color:var(--ink);}
.stat-value.danger{color:var(--danger);}
.stat-value.warn{color:var(--warn);}
.stat-value.green{color:var(--green);}
.stat-note{font-size:11px;color:var(--mist);margin-top:6px;}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse;}
.data-table thead tr{border-bottom:1px solid var(--line);}
.data-table th{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);padding:0 0 12px 0;text-align:left;}
.data-table th:not(:first-child){padding-left:16px;}
.data-table tbody tr{border-bottom:1px solid var(--border);}
.data-table tbody tr:hover{background:rgba(255,255,255,.03);}
.data-table td{padding:14px 0;font-size:14px;vertical-align:middle;}
.data-table td:not(:first-child){padding-left:16px;}
.item-name{font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);overflow-wrap:break-word;min-width:96px;}
.item-unit{font-size:12px;color:var(--mist);margin-top:4px;}

/* ── STATUS ── */
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
.s-ok{background:rgba(159,216,180,.14);color:var(--green);}
.s-warn{background:rgba(244,194,122,.14);color:var(--warn);}
.s-danger{background:rgba(255,154,168,.16);color:var(--danger);}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot-ok{background:var(--green);}
.dot-warn{background:var(--warn);animation:blink 1.8s infinite;}
.dot-danger{background:var(--danger);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.stock-bar-wrap{height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;width:120px;margin-top:6px;}
.stock-bar{height:100%;border-radius:2px;transition:width 0.4s ease;}

/* ── CEK STOK / INPUT ── */
.input-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.input-card{background:var(--fill);border:1px solid var(--line);border-radius:16px;padding:20px;}
.input-card-name{font:700 14px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.input-card-stock{font-size:12px;color:var(--mist);margin-bottom:12px;}
.input-row{display:flex;gap:8px;align-items:center;}
.ck-lbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);margin:12px 0 6px;}
.qty-input{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:400 20px var(--sans);color:var(--ink);background:var(--fill);text-align:right;width:100%;min-height:52px;}
.qty-input:focus{outline:none;border-color:#fff;}
.unit-label{font-size:13px;color:var(--mist);min-width:34px;}
.restock-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--fill);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;}
.restock-name{font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;}
.restock-stock{font-size:12px;color:var(--mist);margin-top:6px;}

/* ── BUTTONS ── */
.btn-sm{background:#fff;color:#121210;border:1px solid #fff;border-radius:100px;padding:12px 20px;font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:100px;padding:12px 20px;font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;}
.btn-ghost:hover{border-color:#fff;}
.btn-full{width:100%;background:#fff;color:#121210;border:1px solid #fff;border-radius:100px;padding:16px 24px;font:700 13px var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;}
.btn-full.danger{background:var(--danger);border-color:var(--danger);color:#121210;}
.btn-full:disabled{opacity:.3;cursor:not-allowed;}
.btn-sm:active,.btn-ghost:active,.btn-full:active,.nav-link:active{opacity:.85;}

/* ── ALERTS ── */
.alert-strip{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-radius:14px;margin-bottom:20px;border:1px solid;}
.alert-danger{background:rgba(255,154,168,.08);border-color:rgba(255,154,168,.55);}
.alert-warn{background:rgba(255,255,255,.05);border-color:var(--line);}
.alert-label{font-size:13px;font-weight:700;}
.alert-body{font-size:12px;margin-top:4px;color:var(--mist);line-height:1.6;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:modalIn 0.2s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font:400 20px/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px;color:var(--ink);}
.form-label{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);margin-bottom:8px;}
.form-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:400 15px var(--sans);color:var(--ink);background-color:var(--fill);margin-bottom:20px;min-height:48px;}
.form-input:focus{outline:none;border-color:#fff;}
.modal-actions{display:flex;gap:10px;margin-top:8px;}

/* ── TOAST ── */
#toaster{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:90vw;}
.toast{background:#fff;color:#121210;padding:12px 20px;border-radius:100px;font:700 12.5px var(--sans);display:flex;align-items:center;gap:10px;max-width:360px;animation:toastIn 0.25s ease;box-shadow:0 6px 24px rgba(0,0,0,.35);}
.toast.err{background:var(--danger);}
.toast.wrn{background:var(--warn);}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.hidden{display:none !important;}

/* ── FORECAST ── */
.forecast-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.forecast-card{background:var(--fill);border:1px solid var(--line);border-radius:16px;padding:24px;}
.fc-title{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.consumption-item{padding:10px 0;border-bottom:1px solid var(--border);}
.consumption-item:last-child{border-bottom:none;}
.consumption-bar-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.consumption-name{font:700 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;}
.consumption-val{font-size:12px;color:var(--mist);}
.consumption-bar-track{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
.consumption-bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease;}
.menu-gauge-list{display:flex;flex-direction:column;}
.menu-gauge-item{padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.menu-gauge-item:last-child{border-bottom:none;}
.mgauge-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px;}
.mgauge-name{font:700 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;}
.mgauge-label{font-size:11px;font-weight:700;text-align:right;}
.mgauge-sub{font-size:10px;color:var(--mist);margin-top:2px;}
.mgauge-bar-track{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
.mgauge-bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
.mgauge-bottleneck{font-size:10px;color:var(--mist);margin-top:3px;}
.math-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.math-row:last-child{border-bottom:none;}
.math-row.bottleneck{background:rgba(255,154,168,.08);margin:0 -8px;padding:8px;border-radius:8px;}
.math-formula{font-family:monospace;font-size:11px;background:var(--fill);border:1px solid var(--border);padding:10px 14px;border-radius:10px;line-height:1.8;margin-top:12px;}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:48px 20px;color:var(--mist);}
.empty-title{font:700 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-bottom:8px;}
.empty-text{font-size:13px;line-height:1.6;}

/* tabel lebar (Selisih, Pengaturan bahan) bisa digeser di layar sempit */
.main .data-table{display:table;}

/* ── TABLET POTRET & HP ── */
@media(max-width:900px){
  .topbar{padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;}
  .main{padding:22px 18px 40px;}
  .stat-strip{grid-template-columns:1fr 1fr;}
  .forecast-grid{grid-template-columns:1fr;}
  .main .data-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #owner-stat-strip{grid-template-columns:repeat(3,1fr) !important;}
}
@media(max-width:640px){
  .input-grid{grid-template-columns:1fr;}
  .brand img{height:38px;}
  .page-title{font-size:20px;}
  .stat-value{font-size:26px;}
  .toast{max-width:100%;}
  .login-head{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px;}
}
</style>
</head>
<body>
<!-- LOGIN -->
<div class="bg" aria-hidden="true"></div>
<div id="login-page">
  <div class="login-head">
    <div class="brand"><img id="login-logo" alt="Nirmala"><div><b>Nirmala</b><small>INVENTORY</small></div></div>
    <div class="clock"><b class="cT">--:--:--</b><span class="cD">-</span></div>
  </div>
  <div class="login-right">
    <div class="login-form">
      <h2>Selamat datang</h2>
      <p>Pilih role dan masukkan PIN untuk melanjutkan.</p>
      <div class="role-card selected" id="rc-barista" onclick="selectRole('barista')">
        <div class="role-icon">☕</div>
        <div><div class="role-name">Barista</div><div class="role-sub">Input stok & restock harian</div></div>
      </div>
      <div class="role-card" id="rc-owner" onclick="selectRole('owner')">
        <div class="role-icon">◎</div>
        <div><div class="role-name">Owner</div><div class="role-sub">Dashboard, laporan & forecast</div></div>
      </div>
      <div style="margin-top:28px;margin-bottom:6px;">
        <label class="form-label" style="margin-bottom:8px;">PIN Akses</label>
        <input type="password" class="pin-field" id="pin-input" maxlength="8" inputmode="numeric" placeholder="••••" autocomplete="off">
        <div class="pin-error" id="pin-error">PIN salah. Coba lagi.</div>
      </div>
      <button class="btn-login" onclick="attemptLogin()">Masuk →</button>
      
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><img id="topbar-logo" alt="Nirmala"><div><b>Nirmala</b><small>INVENTORY</small></div></div>
      <div class="clock"><b class="cT">--:--:--</b><span class="cD">-</span></div>
    </div>
    <div class="topbar-row2">
      <div class="topbar-nav" id="nav-tabs"></div>
      <div class="topbar-right">
        <div class="role-pill" id="role-pill" onclick="logout()">
          <span id="pill-icon">☕</span>
          <span id="pill-label">Barista</span>
          <span style="color:var(--mist);">· Keluar</span>
        </div>
      </div>
    </div>
  </div>
  <div class="main" id="main-content"></div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modal-inner"></div>
  </div>
</div>
<div id="toaster"></div>

const _MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function tickClock(){
  const w=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Jakarta'})),p=n=>String(n).padStart(2,'0');
  const t=p(w.getHours())+':'+p(w.getMinutes())+':'+p(w.getSeconds()),d=_DOW[w.getDay()]+', '+w.getDate()+' '+_MON[w.getMonth()]+' '+w.getFullYear();
  document.querySelectorAll('.cT').forEach(e=>e.textContent=t);
  document.querySelectorAll('.cD').forEach(e=>e.textContent=d);
}

const BARISTA_PIN = '1234';

let UNIT_PRICES = {};     // {'bahan': Rp per satuan}

// Nilai Aset = Σ (Stok Tersisa × Harga per Satuan)
function calcAssetValue(){
  const inv=getInv();
  return INVENTORY_DEF.reduce((sum,item)=>{
    const stock=inv[item.name]??0;
    const hargaSatuan=UNIT_PRICES[item.name]??0;
    return sum+(stock*hargaSatuan);
  },0);
}
// ══ STORAGE — Supabase ══
// PostgREST default membatasi hasil query ke 1000 baris per request.
// Kalau nc_sales/nc_restock sudah lebih dari 1000 baris, data lama (mis. Juni)
// akan kepotong dan gak ke-load. fetchAllRows() ambil SEMUA baris via pagination
// otomatis per 1000 baris sampai habis.
async function fetchAllRows(table, orderCol, ascending){
  const pageSize=1000;
  let from=0, all=[], done=false;
  while(!done){
    const {data,error}=await sb.from(table).select('*').order(orderCol,{ascending}).range(from,from+pageSize-1);
    if(error){console.error('fetchAllRows error on '+table,error);break;}
    all=all.concat(data||[]);
    if(!data||data.length<pageSize)done=true;
    from+=pageSize;
  }
  return all;
}
async function loadAllData(){
  const [invRes,restock,sales,ingRes,recRes,prices]=await Promise.all([
    sb.from('nc_inventory').select('*'),
    fetchAllRows('nc_restock','ts',false),
    fetchAllRows('nc_sales','ts',false),
    sb.from('nc_ingredient').select('*').eq('active',true).order('name'),
    sb.rpc('nc_recipes_expanded'),
    priceMap(today()),
  ]);
  _inv={};
  (invRes.data||[]).forEach(r=>_inv[r.name]=parseFloat(r.stock)||0);
  _restock=restock;
  _sales=sales;
  const num=v=>v==null||v===''?null:Number(v);
  INVENTORY_DEF=(ingRes.data||[]).filter(r=>!r.kind||r.kind==='stok').map(r=>({
    name:r.name, unit:r.unit, rop:Number(r.rop)||0, ropLabel:null,
    tare_g:Number(r.tare_g)||0, full_gross_g:num(r.full_gross_g), full_content:num(r.full_content),
  }));
  // Resep per menu dalam bahan STOK (racikan sudah dipecah, mint/kemasan dibuang) untuk forecast.
  // Kalau fungsi database belum ada, pakai tabel resep apa adanya.
  let recRows=recRes.data;
  if(recRes.error){const r=await sb.from('nc_recipe').select('menu_name,ingredient_name,qty_used');recRows=(r.data||[]).map(x=>({menu_name:x.menu_name,ingredient_name:x.ingredient_name,qty:x.qty_used}));}
  RECIPES={};
  (recRows||[]).forEach(r=>{(RECIPES[r.menu_name]||(RECIPES[r.menu_name]={}))[r.ingredient_name]=Number(r.qty)||0;});
  UNIT_PRICES=prices;
  if(ingRes.error)toast('Gagal memuat daftar bahan: '+ingRes.error.message,'err');
}
function getInv(){return _inv||{};}
function getRestock(){return _restock||[];}
function getSales(){return _sales||[];}
async function saveStock(name,stock){
  await sb.from('nc_inventory').upsert({name,stock,updated_at:new Date().toISOString()},{onConflict:'name'});
  _inv[name]=stock;
}
async function addSale(row){await sb.from('nc_sales').insert(row);(_sales=_sales||[]).unshift(row);}
async function addRestock(row){await sb.from('nc_restock').insert(row);(_restock=_restock||[]).unshift(row);}

// PIN owner dicek di server lewat /api/sales-report (env OWNER_PIN di Vercel),
// jadi tidak ada PIN owner di kode halaman ini dan tidak perlu function Vercel baru.
let role='barista',tab='',selRole='barista',_loggingIn=false;
function selectRole(r){
  selRole=r;
  document.getElementById('rc-barista').classList.toggle('selected',r==='barista');
  document.getElementById('rc-owner').classList.toggle('selected',r==='owner');
}
function showPinError(msg){
  const el=document.getElementById('pin-error');
  el.textContent=msg;el.style.display='block';
}
async function attemptLogin(){
  if(_loggingIn)return;
  const input=document.getElementById('pin-input');
  const pin=input.value.trim();
  document.getElementById('pin-error').style.display='none';
  if(!pin)return;
  let ok=false;
  if(selRole==='barista'){
    ok=pin===BARISTA_PIN;
  } else {
    _loggingIn=true;
    try{
      const r=await fetch('/api/sales-report',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({pin,from:today(),to:today()})});
      if(r.ok)ok=true;
      else if(r.status!==401){
        const j=await r.json().catch(()=>({}));
        showPinError(j.error||('Server error '+r.status));_loggingIn=false;return;
      }
    }catch(e){showPinError('Tidak bisa menghubungi server. Cek koneksi internet.');_loggingIn=false;return;}
    _loggingIn=false;
  }
  if(ok){
    role=selRole;
    _ownerPin=role==='owner'?pin:'';
    input.value='';
    document.getElementById('login-page').style.display='none';
    const app=document.getElementById('app');

// ══ HELPERS ══
function itemDef(name){return INVENTORY_DEF.find(i=>i.name===name);}
function stockStatus(name){
  const inv=getInv(),stock=inv[name]??0,def=itemDef(name);
  if(!def)return'ok';
  if(def.ropLabel==='Warning')return stock<=0?'danger':'warn';
  if(def.ropLabel==='Aman')return'ok';
  if(!def.rop)return'ok';
  if(stock<def.rop)return'danger';
  if(stock<def.rop*1.25)return'warn';
  return'ok';
}
function statusPill(name){
  const s=stockStatus(name);
  const m={ok:['s-ok','dot-ok','Aman'],warn:['s-warn','dot-warn','Perhatian'],danger:['s-danger','dot-danger','Kritis']};
  const[cls,dcls,label]=m[s];
  return '<span class="status-pill '+cls+'"><span class="dot '+dcls+'"></span>'+label+'</span>';
}
function stockBar(name){
  const inv=getInv(),def=itemDef(name),stock=inv[name]??0;
  if(!def||!def.rop)return'';
  const pct=Math.min(100,(stock/(def.rop*2))*100);
  const s=stockStatus(name);
  const color=s==='danger'?'var(--danger)':s==='warn'?'var(--warn)':'var(--green)';
  return '<div class="stock-bar-wrap"><div class="stock-bar" style="width:'+pct+'%;background:'+color+';"></div></div>';
}
function today(){return new Date(Date.now()+7*36e5).toISOString().split('T')[0];} // tanggal WIB
function fmt(n){return n.toLocaleString('id-ID');}
function fmtNum(n){return n%1===0?n:n.toFixed(1);}

async function submitRestock(name,unit){
  const qty=parseFloat(document.getElementById('m-qty').value);
  const priceRaw=document.getElementById('m-price-raw').value;
  const price=priceRaw?parseInt(priceRaw,10):0;
  const note=document.getElementById('m-note').value.trim();
  if(!qty||qty<=0){toast('Masukkan jumlah yang valid','wrn');return;}
  const newStock=((_inv||{})[name]??0)+qty;
  try{
    await saveStock(name,newStock);
    await addRestock({date:today(),ts:Date.now(),item:name,unit,qty,price,note});
    checkInventoryROP();
    const priceStr=price>0?fmtRp(price):'';
    toast('+ '+qty+' '+unit+' '+name+(priceStr?' · '+priceStr:''),'ok');
    closeModal();render();
